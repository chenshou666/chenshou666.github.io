.option.wrong{border-color:rgba(255,110,110,.55);background:rgba(255,110,110,.12)}
.quiz-question{font-size:13.5px;font-weight:650;color:var(--ink);line-height:1.7}
.feedback{border-radius:13px;padding:10px 13px;font-size:12.5px;margin-top:10px}

/* ---------- 四级组件 ---------- */
.audio-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.audio-label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.audio-row{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:15px;
  background:rgba(255,255,255,.46);border:1px solid rgba(255,255,255,.72);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
  transition:transform .2s,box-shadow .2s,background .2s;
}
.audio-row:hover{transform:translateY(-2px);background:rgba(255,255,255,.64);box-shadow:0 10px 26px rgba(20,44,86,.12)}
.audio-hint{font-size:10.5px;color:var(--ink-3)}
.recorder-row{display:flex;align-items:center;gap:12px;padding:14px;border-radius:15px;background:rgba(255,255,255,.46);border:1px solid rgba(255,255,255,.72);transition:.2s}
.rec-dot{width:9px;height:9px;border-radius:50%;background:#ff6b81;box-shadow:0 0 0 4px rgba(255,107,129,.16)}
.self-check{display:grid;gap:8px;padding:14px;border-radius:15px;background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.68)}
.passage{font-size:13px;line-height:1.9;border-radius:15px;padding:14px}
.transcript{background:rgba(255,255,255,.36);border:1px solid rgba(255,255,255,.6);border-radius:14px;padding:13px;font-size:12.5px;color:var(--ink-2);line-height:1.85}
.quiz-item{padding:14px;border-radius:15px;background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.66)}

/* ---------- 总结页 ---------- */
.summary-hero{padding:26px!important;border-radius:26px!important}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0}
.summary-emoji{font-size:34px;line-height:1}
.skill-list{display:grid;gap:10px;margin:14px 0}
.skill-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:13px 15px;border-radius:14px;background:rgba(255,255,255,.44);border:1px solid rgba(255,255,255,.7);transition:.2s}
.skill-row:hover{transform:translateY(-2px);background:rgba(255,255,255,.62);box-shadow:0 10px 24px rgba(20,44,86,.1)}
.skill-state{font-size:11px;font-weight:700;color:var(--accent-2)}
.blank-state{background:rgba(255,255,255,.4);border:1px dashed rgba(20,44,86,.14);border-radius:16px;padding:22px;text-align:center;color:var(--ink-3);font-size:12.5px}

/* ---------- 弹窗 ---------- */
.modal-backdrop{position:fixed;inset:0;z-index:400;display:grid;place-items:center;padding:22px;overflow:auto;background:rgba(14,24,42,.42)!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.modal-backdrop[hidden]{display:none!important}
.reset-dialog{width:min(430px,92vw);max-height:86vh;overflow:auto;padding:26px!important;text-align:left}
.reset-dialog h2{font-size:19px;font-weight:750;letter-spacing:-.3px;margin:0 0 8px;color:var(--ink)}
.reset-dialog p{font-size:12.5px;color:var(--ink-2);line-height:1.75;margin:0 0 6px}
.reset-form label{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-3)}
.reset-form input{width:100%;box-sizing:border-box}
.reset-dialog{
  background:rgba(255,255,255,.86)!important;border:1px solid rgba(255,255,255,.9)!important;
  border-radius:24px!important;box-shadow:0 30px 80px rgba(10,22,44,.3),inset 0 1px 0 #fff!important;
  backdrop-filter:blur(24px) saturate(160%);
}
.reset-form{display:grid;gap:10px;margin:14px 0}
.reset-form input{padding:11px 14px!important;border-radius:13px!important;border:1px solid rgba(20,44,86,.14)!important;background:rgba(255,255,255,.8)!important;color:var(--ink)!important;font-size:13px!important}
.reset-form input:focus{outline:none;border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accent-soft)!important}
.reset-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.reset-error{font-size:11.5px;color:#b23a3a;background:rgba(255,110,110,.12);border:1px solid rgba(255,110,110,.24);border-radius:10px;padding:8px 11px}

/* ---------- 胜利页 ---------- */
/* 胜利遮罩：真正悬浮居中 */
.victory-overlay{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:22px;overflow:auto;background:radial-gradient(circle at 50% 38%,rgba(24,44,86,.3),rgba(8,16,32,.46));backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);animation:victory-in .32s cubic-bezier(.2,.8,.24,1) both}
.victory-overlay.is-leaving{animation:victory-out .42s ease forwards}
@keyframes victory-in{0%{opacity:0}100%{opacity:1}}
@keyframes victory-out{to{opacity:0}}
.victory-card{width:min(420px,92vw);border-radius:28px!important;padding:30px 26px!important;text-align:center;animation:victory-card-in .52s cubic-bezier(.2,.86,.24,1) both}
@keyframes victory-card-in{0%{opacity:0;transform:translateY(22px) scale(.94)}60%{opacity:1}100%{opacity:1;transform:none}}
.victory-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.victory-next{border-radius:99px!important}
.victory-dismiss{background:rgba(255,255,255,.5)!important;border:1px solid rgba(255,255,255,.8)!important;color:var(--ink)!important;border-radius:99px!important;padding:10px 18px!important;font:inherit;font-size:12.5px;font-weight:650;cursor:pointer}
.victory-medal{font-size:52px;line-height:1;margin-bottom:8px;filter:drop-shadow(0 12px 24px rgba(20,44,86,.2))}
.victory-kicker{font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.victory-title{font-size:24px;font-weight:750;letter-spacing:-.6px;color:var(--ink);margin:6px 0 8px}
.victory-copy{font-size:13px;color:var(--ink-2);line-height:1.8;max-width:46ch;margin:0 auto}
.victory-reward{margin:14px auto 0;display:inline-flex;gap:8px;align-items:center;padding:8px 15px;border-radius:99px;background:var(--accent-soft);border:1px solid rgba(47,124,246,.2);color:var(--accent);font-size:12px;font-weight:700}
.victory-dismiss{margin-top:16px}
.victory-confetti{opacity:.9}

/* ---------- 讲解引导 / IDE 细节 ---------- */
.beginner-guide{margin-top:14px}
.guide-columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0}
.guide-heading{font-size:10.5px!important;letter-spacing:1.3px;text-transform:uppercase;font-weight:750;color:var(--ink-3)!important;margin-bottom:8px}
.guide-card,.guide-idea{padding:14px!important;border-radius:15px!important;background:rgba(255,255,255,.44)!important;border:1px solid rgba(255,255,255,.7)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)!important}
.guide-idea p{font-size:12.5px;color:var(--ink-2);line-height:1.8;margin:0}
.guide-list{margin:0;padding-left:0;list-style:none;display:grid;gap:7px}
.guide-list li{font-size:12.5px;color:var(--ink-2);padding-left:24px;position:relative;line-height:1.7}
.guide-list li::before{content:counter(g);counter-increment:g;position:absolute;left:0;top:2px;width:17px;height:17px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:9.5px;font-weight:800;display:grid;place-items:center}
.guide-list{counter-reset:g}
.guide-pitfall{font-size:12.5px;color:#8a6a1f;background:rgba(255,214,120,.18);border:1px solid rgba(240,190,80,.3);border-radius:13px;padding:12px 14px;line-height:1.8}
.ide-toolbar-left,.ide-toolbar-right{display:flex;align-items:center;gap:8px}
.ide-dots{display:flex;gap:5px}
.ide-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);display:block}
.ide-file{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(226,238,255,.6)}
.ide-help{font-size:10.5px;color:rgba(226,238,255,.6)}
.ide-standard{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:#bfe0ff;background:rgba(120,180,255,.18);border:1px solid rgba(140,200,255,.3);border-radius:99px;padding:3px 8px}
.ide-workspace{display:flex;min-height:290px}
.code-input,.ide-code{color:#e6efff;font-family:"Cascadia Code",Consolas,"SF Mono",monospace;font-size:12.5px;line-height:1.85}

/* ---------- 其它细节 ---------- */
.btn-small{padding:7px 12px!important;font-size:11.5px!important}
.mobile-menu{background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.85);border-radius:13px;backdrop-filter:blur(16px)}
.dots{display:flex;gap:5px}
.summary-grid .stat{padding:14px!important}
@media(max-width:900px){
  .course-cards{grid-template-columns:1fr}
  .guide-columns{grid-template-columns:1fr}
  .lesson-layout{grid-template-columns:1fr!important}
}

/* ==== 外观参数联动：所有卡片读取外观面板变量 ==== */
:root{
  --r-card:calc(var(--r-l) - 4px);
  --r-chip:calc(var(--r-l) - 9px);
}
/* 统一给卡片加可调模糊 + 圆角 */
.level-card,.course-entry,.track-head,.course-route-heading,.option,.audio-row,.recorder-row,
.self-check,.quiz-item,.skill-row,.guide-card,.guide-idea,.takeaway,.challenge-card,.point-item,
.transcript,.blank-state,.lock-note,.level-num,.course-library-total,.source-chip,.tags span{
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
}
.level-card{border-radius:var(--r-card)!important;background:rgba(255,255,255,var(--glass-alpha))!important}
.level-card::after{opacity:var(--edge)!important}
.level-card:hover{background:rgba(255,255,255,calc(var(--glass-alpha) + .14))!important}
.level-card.locked{background:rgba(255,255,255,calc(var(--glass-alpha) - .22))!important}
.level-card.locked:hover{background:rgba(255,255,255,calc(var(--glass-alpha) - .04))!important}
.level-card.completed{
  background:linear-gradient(158deg,rgba(255,255,255,calc(var(--glass-alpha) + .1)),rgba(226,252,242,calc(var(--glass-alpha) - .04)))!important;
}
.level-num{border-radius:var(--r-chip)!important;background:rgba(255,255,255,calc(var(--glass-alpha) + .14))!important}
/* 导航 */
.nav-btn{border-radius:var(--r-card)!important}
.nav-btn:hover{background:rgba(255,255,255,calc(var(--glass-alpha) - .06))!important}
.nav-btn.active{background:rgba(255,255,255,calc(var(--glass-alpha) + .16))!important}
/* 路线 / 课程入口 */
.track-head{border-radius:var(--r-card)!important;background:rgba(255,255,255,calc(var(--glass-alpha) - .12))!important}
.track:hover .track-head{background:rgba(255,255,255,calc(var(--glass-alpha) + .02))!important}
.course-route-heading{border-radius:var(--r-card)!important;background:rgba(255,255,255,calc(var(--glass-alpha) - .14))!important}
.course-library-total{border-radius:999px!important;background:rgba(255,255,255,calc(var(--glass-alpha) - .08))!important}
.course-entry{border-radius:var(--r-card)!important;background:rgba(255,255,255,calc(var(--glass-alpha) - .08))!important}
.course-entry:hover{background:rgba(255,255,255,calc(var(--glass-alpha) + .06))!important}
/* 讲解 / 答题 / 四级 */
.challenge-card,.takeaway,.guide-card,.guide-idea,.self-check{border-radius:var(--r-card)!important;background:rgba(255,255,255,calc(var(--glass-alpha) - .14))!important}
.point-item,.transcript,.quiz-item{border-radius:var(--r-card)!important;background:rgba(255,255,255,calc(var(--glass-alpha) - .16))!important}
.point-item:hover{background:rgba(255,255,255,calc(var(--glass-alpha) - .02))!important}
.option{border-radius:var(--r-card)!important;background:rgba(255,255,255,calc(var(--glass-alpha) - .1))!important}
.option:hover{background:rgba(255,255,255,calc(var(--glass-alpha) + .04))!important}
.option.selected{background:var(--accent-soft)!important}
.audio-row,.recorder-row{border-radius:var(--r-card)!important;background:rgba(255,255,255,calc(var(--glass-alpha) - .1))!important}
.audio-row:hover{background:rgba(255,255,255,calc(var(--glass-alpha) + .04))!important}
.skill-row{border-radius:var(--r-card)!important;background:rgba(255,255,255,calc(var(--glass-alpha) - .12))!important}
.skill-row:hover{background:rgba(255,255,255,calc(var(--glass-alpha) + .02))!important}
.blank-state,.lock-note{border-radius:var(--r-card)!important;background:rgba(255,255,255,calc(var(--glass-alpha) - .2))!important}
.track,.course-route,.panel,.stat,.hero,.hero-progress{border-radius:var(--r-l)!important}
/* 弹窗 / 其它 */
.reset-dialog{border-radius:var(--r-xl)!important;background:rgba(255,255,255,calc(var(--glass-alpha) + .3))!important}
.reset-form input{border-radius:var(--r-card)!important;background:rgba(255,255,255,calc(var(--glass-alpha) + .26))!important}
.mobile-menu{background:rgba(255,255,255,calc(var(--glass-alpha) + .16))!important}
.streak{background:rgba(255,255,255,calc(var(--glass-alpha) - .14))!important}
/* 夜空：用夜间透明度变量派生 */
html[data-sky="night"] .level-card{background:rgba(255,255,255,var(--glass-alpha-n))!important}
html[data-sky="night"] .level-card:hover{background:rgba(255,255,255,calc(var(--glass-alpha-n) + .06))!important}
html[data-sky="night"] .level-card.locked{background:rgba(255,255,255,calc(var(--glass-alpha-n) - .04))!important}
html[data-sky="night"] .level-card.locked:hover{background:rgba(255,255,255,calc(var(--glass-alpha-n) + .02))!important}
html[data-sky="night"] .level-card.completed{background:rgba(70,220,170,calc(var(--glass-alpha-n) + .04))!important}
html[data-sky="night"] .level-num{background:rgba(255,255,255,calc(var(--glass-alpha-n) + .04))!important}
html[data-sky="night"] .nav-btn:hover{background:rgba(255,255,255,calc(var(--glass-alpha-n) + .02))!important}
html[data-sky="night"] .nav-btn.active{background:rgba(255,255,255,calc(var(--glass-alpha-n) + .1))!important}
html[data-sky="night"] .track-head,html[data-sky="night"] .course-route-heading{background:rgba(255,255,255,calc(var(--glass-alpha-n) - .02))!important}
html[data-sky="night"] .course-entry,html[data-sky="night"] .course-library-total{background:rgba(255,255,255,var(--glass-alpha-n))!important}
html[data-sky="night"] .option,html[data-sky="night"] .audio-row,html[data-sky="night"] .recorder-row{background:rgba(255,255,255,var(--glass-alpha-n))!important}
html[data-sky="night"] .challenge-card,html[data-sky="night"] .takeaway,html[data-sky="night"] .guide-card,html[data-sky="night"] .guide-idea,html[data-sky="night"] .self-check,html[data-sky="night"] .point-item,html[data-sky="night"] .transcript,html[data-sky="night"] .quiz-item{background:rgba(255,255,255,calc(var(--glass-alpha-n) - .02))!important}
html[data-sky="night"] .reset-dialog{background:rgba(18,28,48,calc(var(--glass-alpha-n) + .55))!important}
/* 关掉面板外的自动过渡打断（保持不变） */
@media(prefers-reduced-motion:reduce){
  .level-card,.course-entry,.option,.audio-row,.nav-btn{transition:none!important}
}

/* ==== 关卡区玻璃层次重做 ==== */
/* 外层容器退成「很淡的玻璃」，把关卡的玻璃感让出来 */
.course-route{
  background:rgba(255,255,255,.12)!important;
  border:1px solid rgba(255,255,255,.5)!important;
  box-shadow:0 24px 60px rgba(20,44,86,.10),inset 0 1px 0 rgba(255,255,255,.65)!important;
  backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);
}
.track{
  background:transparent!important;
  border:0!important;
  box-shadow:none!important;
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
  padding:14px 0 4px!important;
}
.track-head{
  background:rgba(255,255,255,.16)!important;
  border:1px solid rgba(255,255,255,.42)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7)!important;
  backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);
}
/* 关卡卡：真正的磨砂玻璃（淡白渐变 + 强模糊 + 亮描边 + 内高光） */
.level-card{
  background:linear-gradient(152deg,
    rgba(255,255,255,calc(var(--glass-alpha) - .16)),
    rgba(255,255,255,calc(var(--glass-alpha) - .34)))!important;
  border:1px solid rgba(255,255,255,.62)!important;
  backdrop-filter:blur(var(--glass-blur)) saturate(170%)!important;
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(170%)!important;
  box-shadow:0 10px 30px rgba(20,44,86,.11),inset 0 1px 0 rgba(255,255,255,.9),
             inset 0 -1px 0 rgba(255,255,255,.25)!important;
}
.level-card::after{
  background:linear-gradient(148deg,rgba(255,255,255,.55),rgba(255,255,255,0) 42%,rgba(255,255,255,0) 70%,rgba(255,255,255,.2))!important;
  opacity:var(--edge)!important;
}
.level-card:hover{
  background:linear-gradient(152deg,
    rgba(255,255,255,calc(var(--glass-alpha) + .06)),
    rgba(255,255,255,calc(var(--glass-alpha) - .16)))!important;
  border-color:rgba(255,255,255,.9)!important;
  box-shadow:0 24px 54px rgba(20,44,86,.17),inset 0 1px 0 #fff!important;
}
.level-card.completed{
  background:linear-gradient(152deg,
    rgba(255,255,255,calc(var(--glass-alpha) - .12)),
    rgba(208,248,232,calc(var(--glass-alpha) - .3)))!important;
  border-color:rgba(140,225,190,.7)!important;
}
.level-card.locked{
  background:linear-gradient(152deg,
    rgba(255,255,255,calc(var(--glass-alpha) - .3)),
    rgba(255,255,255,calc(var(--glass-alpha) - .42)))!important;
  border-color:rgba(255,255,255,.42)!important;
}
.level-card.locked:hover{
  background:linear-gradient(152deg,
    rgba(255,255,255,calc(var(--glass-alpha) - .12)),
    rgba(255,255,255,calc(var(--glass-alpha) - .26)))!important;
  border-color:rgba(255,255,255,.72)!important;
}
.level-num{
  background:rgba(255,255,255,calc(var(--glass-alpha) + .02))!important;
  border-color:rgba(255,255,255,.8)!important;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
/* 夜空：玻璃层次同样成立 */
html[data-sky="night"] .course-route{background:rgba(255,255,255,.05)!important;border-color:rgba(255,255,255,.18)!important}
html[data-sky="night"] .track-head{background:rgba(255,255,255,.08)!important;border-color:rgba(255,255,255,.16)!important}
html[data-sky="night"] .level-card{
  background:linear-gradient(152deg,rgba(255,255,255,.14),rgba(255,255,255,.05))!important;
  border-color:rgba(255,255,255,.26)!important;
  box-shadow:0 14px 34px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.18)!important;
}
html[data-sky="night"] .level-card:hover{background:linear-gradient(152deg,rgba(255,255,255,.22),rgba(255,255,255,.1))!important;border-color:rgba(255,255,255,.44)!important}
html[data-sky="night"] .level-card.completed{background:linear-gradient(152deg,rgba(80,225,175,.22),rgba(60,190,150,.12))!important;border-color:rgba(120,235,195,.4)!important}
html[data-sky="night"] .level-card.locked{background:linear-gradient(152deg,rgba(255,255,255,.07),rgba(255,255,255,.03))!important;border-color:rgba(255,255,255,.14)!important}
html[data-sky="night"] .level-num{background:rgba(255,255,255,.12)!important;border-color:rgba(255,255,255,.2)!important}

/* ==== 果冻弹簧交互（QQ 弹弹） ==== */
/* 弹簧缓动：先冲过目标再回弹，产生果冻感 */
:root{
  --jelly-spring:cubic-bezier(.34,1.62,.46,.98);
  --jelly-out:cubic-bezier(.22,.61,.36,1);
}
.level-card,.course-card,.stat,.course-entry,.option,.audio-row,.recorder-row,.self-check,
.quiz-item,.skill-row,.guide-card,.guide-idea,.takeaway-item,.point-item,.side-card,
.btn,.nav-btn,.ap-chip,.ap-fab,.streak,.avatar{
  transition:transform .42s var(--jelly-spring),box-shadow .3s ease,border-color .3s ease,background .3s ease;
  transform-origin:center bottom;
  will-change:transform;
}
/* hover：触发果冻回弹关键帧（结束帧 = hover 终态，可无缝接管） */
.level-card:hover,.course-entry:hover,.stat:hover,.skill-row:hover,.guide-card:hover,
.guide-idea:hover,.self-check:hover,.quiz-item:hover,.audio-row:hover,.recorder-row:hover,
.takeaway-item:hover,.point-item:hover,.side-card:hover,.option:hover{
  animation:jelly-pop .52s var(--jelly-spring) 1;
}
.course-card:hover,.btn:hover,.ap-fab:hover{animation:jelly-pop-lg .58s var(--jelly-spring) 1}
.nav-btn:hover{animation:jelly-slide .46s var(--jelly-spring) 1}
@keyframes jelly-pop{
  0%{transform:translateY(0) scale(1,1)}
  28%{transform:translateY(-7px) scale(1.035,.965)}
  52%{transform:translateY(-2px) scale(.985,1.018)}
  72%{transform:translateY(-5px) scale(1.012,.994)}
  88%{transform:translateY(-3.5px) scale(.997,1.004)}
  100%{transform:translateY(-3px) scale(1,1)}
}
@keyframes jelly-pop-lg{
  0%{transform:translateY(0) scale(1,1)}
  30%{transform:translateY(-9px) scale(1.04,.958)}
  55%{transform:translateY(-3px) scale(.982,1.024)}
  76%{transform:translateY(-6px) scale(1.014,.992)}
  100%{transform:translateY(-4px) scale(1,1)}
}
@keyframes jelly-slide{
  0%{transform:translateX(0) scale(1,1)}
  38%{transform:translateX(5px) scale(.985,1.015)}
  62%{transform:translateX(1px) scale(1.008,.994)}
  84%{transform:translateX(3px) scale(.998,1.002)}
  100%{transform:translateX(2px) scale(1,1)}
}
/* 按下：压扁（QQ 感） */
.level-card:active,.course-card:active,.stat:active,.course-entry:active,.option:active,
.audio-row:active,.quiz-item:active,.skill-row:active,.guide-card:active,.guide-idea:active,
.self-check:active,.recorder-row:active,.takeaway-item:active,.point-item:active,.side-card:active,
.btn:active,.nav-btn:active{
  animation:none!important;
  transform:translateY(1px) scale(.965,.955)!important;
  transition:transform .11s ease-out!important;
}
/* 松手回弹 */
.level-card:not(:active):hover{transition:transform .42s var(--jelly-spring),box-shadow .3s ease}
/* 悬停终态（关键帧结束后接管，保证不跳） */
.level-card:hover{transform:translateY(-3px)}
.course-card:hover,.btn:hover,.ap-fab:hover{transform:translateY(-4px)}
.nav-btn:hover{transform:translateX(2px)}
/* 触屏 / 减弱动效：关闭果冻 */
@media(hover:none),(prefers-reduced-motion:reduce){
  .level-card,.course-card,.stat,.course-entry,.option,.audio-row,.recorder-row,.self-check,
  .quiz-item,.skill-row,.guide-card,.guide-idea,.takeaway-item,.point-item,.side-card,
  .btn,.nav-btn,.ap-chip,.ap-fab,.streak,.avatar{animation:none!important;transition:transform .18s ease,box-shadow .2s ease,border-color .2s ease}
  .level-card:active,.course-card:active,.option:active,.btn:active,.nav-btn:active{transform:scale(.99)!important}
}

/* ==== 指针跟随倾斜（跟随鼠标，不自动乱弹） ==== */
/* 关闭之前的自动果冻 hover 动画（保留按下回弹） */
.level-card:hover,.course-card:hover,.stat:hover,.course-entry:hover,.option:hover,
.audio-row:hover,.recorder-row:hover,.self-check:hover,.quiz-item:hover,.skill-row:hover,
.guide-card:hover,.guide-idea:hover,.takeaway-item:hover,.point-item:hover,.side-card:hover,
.btn:hover,.nav-btn:hover,.ap-fab:hover{animation:none!important}
/* 可倾斜的卡片 */
.level-card,.course-card,.stat,.course-entry,.side-card,.guide-card,.skill-row,.summary-hero{
  transform-style:preserve-3d;
  transform:perspective(780px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--lift,0px)) scale(var(--scl,1));
  transition:transform .5s cubic-bezier(.22,.68,.3,1),box-shadow .3s ease,border-color .3s ease;
  will-change:transform;
}
/* 跟随中：极短过渡保证跟手 */
.level-card.tilting,.course-card.tilting,.stat.tilting,.course-entry.tilting,
.side-card.tilting,.guide-card.tilting,.skill-row.tilting,.summary-hero.tilting{
  transition:transform .08s linear,box-shadow .25s ease,border-color .25s ease;
  z-index:3;
  transform:perspective(780px)
            rotateX(var(--rx,0deg))
            rotateY(var(--ry,0deg))
            translateY(calc(var(--lift,0px) - 3px))
            scale(calc(var(--scl,1) + .008))!important;
  box-shadow:0 18px 40px rgba(20,44,86,.16),inset 0 1px 0 rgba(255,255,255,.95)!important;
}
/* 高光跟着指针走（果冻感来自玻璃反光，而非乱弹） */
.level-card.tilting::after{
  background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),
    rgba(255,255,255,.85),rgba(255,255,255,.25) 26%,rgba(255,255,255,0) 58%)!important;
  opacity:.95!important;mix-blend-mode:screen;
}
/* hover 终态不再位移（由 --lift 控制） */
.level-card:hover,.course-card:hover,.stat:hover,.course-entry:hover,.side-card:hover,
.guide-card:hover,.skill-row:hover{transform:perspective(780px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(calc(var(--lift,0px) - 3px)) scale(calc(var(--scl,1) + .008))}
/* 按下：短促压扁（保留一点 QQ 感，但不乱弹） */
.level-card:active,.course-card:active,.stat:active,.course-entry:active{--scl:.985;--lift:1px}
/* 夜空 */
html[data-sky="night"] .level-card.tilting,html[data-sky="night"] .course-card.tilting,
html[data-sky="night"] .stat.tilting,html[data-sky="night"] .course-entry.tilting,
html[data-sky="night"] .side-card.tilting{box-shadow:0 20px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.24)!important}
@media(hover:none),(prefers-reduced-motion:reduce){
  .level-card,.course-card,.stat,.course-entry,.side-card,.guide-card,.skill-row,.summary-hero{transform:none!important;transition:box-shadow .2s ease,border-color .2s ease}
  .level-card.tilting,.course-card.tilting,.stat.tilting,.course-entry.tilting,.side-card.tilting,.guide-card.tilting,.skill-row.tilting{transform:none!important}
}

/* ==== 侧栏 / 顶栏：滑入而不是掉落 ==== */
.app.interface-reveal .slide-across{will-change:translate,opacity;animation:panel-slide .8s cubic-bezier(.2,.82,.22,1) var(--drop-delay,0ms) both}
@keyframes panel-slide{
  0%{opacity:0;translate:-105% 0}
  52%{opacity:1;translate:12px 0}
  74%{translate:-5px 0}
  88%{translate:3px 0}
  100%{opacity:1;translate:0 0}
}
/* 顶栏从上方轻滑入（不是整屏掉落） */
.app.interface-reveal .topbar.slide-across{animation:topbar-slide .72s cubic-bezier(.2,.82,.22,1) var(--drop-delay,0ms) both}
@keyframes topbar-slide{
  0%{opacity:0;translate:0 -34px}
  60%{opacity:1;translate:0 6px}
  82%{translate:0 -2px}
  100%{opacity:1;translate:0 0}
}
@media(prefers-reduced-motion:reduce){.app.interface-reveal .slide-across{animation:none;translate:none;opacity:1}}

/* ==== 页面切换：丝滑滑入 + 逐步进入 ==== */
#view.view-enter{
  animation:page-enter .62s cubic-bezier(.16,.84,.28,1) backwards;
  will-change:opacity,transform,filter;
}
@keyframes page-enter{
  0%{opacity:0;transform:translateY(16px);filter:blur(6px)}
  55%{opacity:1;filter:blur(0)}
  100%{opacity:1;transform:none;filter:blur(0)}
}
/* 区块逐个丝滑滑入（backwards 填充：动画结束后交还 hover/倾斜） */
#view.view-enter > *{
  animation:block-enter .66s cubic-bezier(.16,.84,.28,1) backwards;
  will-change:opacity,transform;
}
#view.view-enter > *:nth-child(1){animation-delay:0s}
#view.view-enter > *:nth-child(2){animation-delay:.055s}
#view.view-enter > *:nth-child(3){animation-delay:.11s}
#view.view-enter > *:nth-child(4){animation-delay:.165s}
#view.view-enter > *:nth-child(5){animation-delay:.22s}
#view.view-enter > *:nth-child(6){animation-delay:.275s}
#view.view-enter > *:nth-child(7){animation-delay:.33s}
#view.view-enter > *:nth-child(n+8){animation-delay:.375s}
@keyframes block-enter{
  0%{opacity:0;transform:translateY(22px) scale(.994)}
  62%{opacity:1}
  100%{opacity:1;transform:none}
}
/* 卡片层再细分一层：让同一区块里的卡片也依次进入 */
#view.view-enter .course-card,
#view.view-enter .level-card,
#view.view-enter .stat,
#view.view-enter .course-entry,
#view.view-enter .panel,
#view.view-enter .track{
  animation:block-enter .6s cubic-bezier(.16,.84,.28,1) backwards;
}
#view.view-enter .course-card:nth-child(1){animation-delay:.06s}
#view.view-enter .course-card:nth-child(2){animation-delay:.12s}
#view.view-enter .course-card:nth-child(3){animation-delay:.18s}
#view.view-enter .stat:nth-child(1){animation-delay:.1s}
#view.view-enter .stat:nth-child(2){animation-delay:.15s}
#view.view-enter .stat:nth-child(3){animation-delay:.2s}
#view.view-enter .stat:nth-child(4){animation-delay:.25s}
#view.view-enter .level-card:nth-child(1){animation-delay:.05s}
#view.view-enter .level-card:nth-child(2){animation-delay:.09s}
#view.view-enter .level-card:nth-child(3){animation-delay:.13s}
#view.view-enter .level-card:nth-child(4){animation-delay:.17s}
#view.view-enter .level-card:nth-child(5){animation-delay:.21s}
#view.view-enter .level-card:nth-child(n+6){animation-delay:.25s}
/* 顶栏：标题与按钮组顺次轻微滑入 */
.topbar.title-enter .top-title{animation:title-enter .6s cubic-bezier(.16,.84,.28,1) .05s backwards}
.topbar.title-enter .top-right{animation:title-enter .6s cubic-bezier(.16,.84,.28,1) .11s backwards}
@keyframes title-enter{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
/* 侧栏导航：当前项指示条平滑过渡 */
.nav-btn{transition:transform .3s cubic-bezier(.16,.84,.28,1),background .3s ease,color .3s ease,box-shadow .3s ease,border-color .3s ease}
@media(prefers-reduced-motion:reduce){
  #view.view-enter,#view.view-enter > *,#view.view-enter .course-card,#view.view-enter .level-card,
  #view.view-enter .stat,#view.view-enter .course-entry,#view.view-enter .panel,#view.view-enter .track,
  .topbar.title-enter .top-title,.topbar.title-enter .top-right{animation:none!important}
}

/* ==== 通关后底部悬浮条（下一关入口） ==== */
.next-bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;
  display:flex;align-items:center;gap:12px;padding:9px 10px 9px 18px;border-radius:999px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.92);
  box-shadow:0 18px 46px rgba(20,44,86,.22),inset 0 1px 0 #fff;
  color:var(--ink);animation:nextbar-in .46s cubic-bezier(.2,.86,.24,1) both;white-space:nowrap}
@keyframes nextbar-in{0%{opacity:0;transform:translate(-50%,20px) scale(.94)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
.next-bar .nb-ok{font-size:12px;font-weight:700;color:#0aa578;letter-spacing:.2px}
.next-bar .nb-actions{display:flex;align-items:center;gap:8px}
.next-bar .btn{padding:8px 15px!important;font-size:12px!important}
html[data-sky="night"] .next-bar{background:rgba(20,32,54,.86);border-color:rgba(255,255,255,.22);box-shadow:0 18px 46px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.16);color:#eaf2ff}
html[data-sky="night"] .next-bar .nb-ok{color:#7ef3d0}
@media(max-width:900px){
  .next-bar{bottom:14px;left:14px;right:14px;transform:none;width:auto;justify-content:space-between;padding:9px 12px;animation:nextbar-in-m .42s cubic-bezier(.2,.86,.24,1) both}
  @keyframes nextbar-in-m{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}
}
@media(prefers-reduced-motion:reduce){.next-bar{animation:none!important}}

/* ==== 进度备份面板 ==== */
.progress-tools{margin-top:18px}
.progress-tools .challenge-copy{font-size:12.5px;line-height:1.85;color:var(--ink-2);margin:6px 0 14px}
.progress-tools .exercise-actions{display:flex;gap:10px;flex-wrap:wrap}

html[data-sky="night"] .lesson-copy .kp-term,html[data-sky="night"] .takeaway-item .kp-term{color:#dbe8ff;background:linear-gradient(180deg,transparent 56%,rgba(90,160,255,.3) 56%)}

html[data-sky="night"] .kp-strong{color:#f1f6ff;background:linear-gradient(180deg,transparent 58%,rgba(90,160,255,.35) 58%)}
html[data-sky="night"] .kp-warn-line{background:rgba(255,186,74,.14);border-left-color:rgba(240,170,60,.7)}

/* ==== 写作/翻译自评量表 ==== */

function importProgressFile(file){

   var n=0;
   PROGRESS_KEYS.forEach(function(k){
    var val=obj.data[k];

   });

}

var SAVE_PREFIX="HT1";
function b64urlFromBytes(bytes){var bin="",i;for(i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function bytesFromB64url(str){var sN=str.replace(/-/g,"+").replace(/_/g,"/");while(sN.length%4)sN+="=";var bin=atob(sN),out=new Uint8Array(bin.length),i;for(i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}

async function compressSaveText(text){
 if(window.CompressionStream){
  var cs=new CompressionStream("gzip");
  var buf=await new Response(new Blob([text]).stream().pipeThrough(cs)).arrayBuffer();
  return "G"+b64urlFromBytes(new Uint8Array(buf));
 }
 return "B"+b64urlFromBytes(new TextEncoder().encode(text));
}
async function decompressSaveText(code){
 var kind=code.charAt(0),payload=code.slice(1),bytes=bytesFromB64url(payload);
 if(kind==="G"){
  if(!window.DecompressionStream)throw new Error("这个浏览器不支持解压存档，请换新版浏览器");
  var ds=new DecompressionStream("gzip");
  return await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
 }
 return new TextDecoder().decode(bytes);
}
async function buildSaveCode(){
 var json=JSON.stringify(saveProgressPayload());
 return SAVE_PREFIX+await compressSaveText(json);
}

async function applySaveCode(raw){
 var code=String(raw||"").trim();
 if(!code)throw new Error("请先粘贴存档码");
 if(code.indexOf("#save=")>=0){code=decodeURIComponent(code.split("#save=")[1]||"")}
 if(code.indexOf("save=")>=0&&code.indexOf(SAVE_PREFIX)!==0){code=code.slice(code.indexOf("save=")+5)}
 if(code.indexOf(SAVE_PREFIX)!==0)throw new Error("存档码格式不对（应以 "+SAVE_PREFIX+" 开头）");
 var json=await decompressSaveText(code.slice(SAVE_PREFIX.length));
 var obj=JSON.parse(json);
 if(!obj||obj.app!=="HT Lab"||!obj.data||typeof obj.data!=="object")throw new Error("存档内容无法识别");
 var n=0;
 PROGRESS_KEYS.forEach(function(k){var val=obj.data[k];if(typeof val==="string"&&val){localStorage.setItem(k,val);n++}});
 if(!n)throw new Error("存档里没有可用进度");
 return n;
}

let recUrl=null,recorder=null,recChunks=[],taskTimer=null;
function stopTaskTimer(){if(taskTimer){clearInterval(taskTimer);taskTimer=null}}
function startTaskTimer(l){
 if(!l||!l.timeLimit)return;
 if(window.taskTimerLevel!==l.id){window.taskDeadline=Date.now()+l.timeLimit*60000;window.taskTimerLevel=l.id}
 if(taskTimer)return;
 taskTimer=setInterval(function(){
  const el=document.getElementById("taskTimer");
  if(!el){stopTaskTimer();return}
  const left=Math.max(0,window.taskDeadline-Date.now());
  const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
  el.textContent=(left>0?"剩余 ":"时间到 ")+m+":"+String(s).padStart(2,"0");
  if(left<=0){stopTaskTimer();if(window.taskState)window.taskState.timeUp=true;if(activeLevel&&activeLevel.type==="mock"&&window.taskState&&!window.taskState.submitted){submitMock(true);return}render()}
 },1000);
}
function ensureTaskState(l){
 if(!window.taskState||window.taskState.levelId!==l.id){
  window.taskState={levelId:l.id,answers:(l.questions||[]).map(function(){return null}),score:null,passed:false,recordUrl:null,recordSkipped:false,checks:{},checkResult:null,submitted:false};
 }
 return window.taskState;
}

function questionBlock(q,qi,l,st){
 const picked=st.answers[qi],answered=picked!==null&&picked!==undefined;
 const exam=l.type==="mock"&&!st.submitted;
 const opts=q.options.map(function(o,i){
  let cl="option";
  if(answered){
   if(exam){if(picked===i)cl+=" selected"}

  }
  return '<button type="button" class="'+cl+'" data-q="'+qi+'" data-pick="'+i+'"'+((answered&&!exam)?" disabled":"")+'>'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>';
 }).join("");
 const fb=(answered&&!exam)?'<div class="feedback '+(picked===q.answer?"ok":"no")+'">'+(picked===q.answer?"✓ 答对了":"✗ 正确答案是 "+String.fromCharCode(65+q.answer))+(q.explain?'　'+esc(q.explain):"")+'</div>':"";
 return '<div class="quiz-item"><div class="quiz-question">第 '+(qi+1)+' 题　'+esc(q.q)+'</div><div class="option-list">'+opts+'</div>'+fb+'</div>';

function submitMock(auto){
 const l=activeLevel;if(!l||!l.questions)return;
 const st=ensureTaskState(l);
 const answered=st.answers.filter(function(a){return a!==null&&a!==undefined}).length;
 if(!auto&&answered<l.questions.length&&!window.confirm("还有 "+(l.questions.length-answered)+" 题未作答，确定交卷？"))return;
 const right=st.answers.filter(function(a,i){return a===l.questions[i].answer}).length;
 st.score={right:right,total:l.questions.length};st.submitted=true;
 data.attempts+=l.questions.length;data.correct+=right;save();
 stopTaskTimer();
 if(right/l.questions.length>=(l.passRatio||0.8)){st.passed=true;completeTask(l);return}
 render();
}
function pickAnswer(qi,pi){
 const l=activeLevel;if(!l||!l.questions)return;
 const st=ensureTaskState(l);
 const exam=l.type==="mock"&&!st.submitted;
 if(exam){
  if(st.answers[qi]===pi)return;
  st.answers[qi]=pi;render();return;
 }
 if(st.answers[qi]!==null&&st.answers[qi]!==undefined)return;
 st.answers[qi]=pi;
 data.attempts++;if(pi===l.questions[qi].answer)data.correct++;save();
 const answered=st.answers.filter(function(a){return a!==null&&a!==undefined}).length;
 const needsTask=(l.type==="write"||l.type==="translate"||l.type==="speak");
 if(answered===l.questions.length&&!needsTask){
  const right=st.answers.filter(function(a,i){return a===l.questions[i].answer}).length;
  st.score={right:right,total:l.questions.length};
  if(right/l.questions.length>=(l.passRatio||0.8)){st.passed=true;completeTask(l);return}
 }
 render();
}

function keyHit(low,k){
 const kk=String(k).toLowerCase();
 if(/^[a-z][a-z'’-]*$/.test(kk)){
  return new RegExp("\\b"+kk.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b").test(low);
 }
 return low.indexOf(kk)>=0;
}
function gradeText(l,text){
 const t=(text||"").trim();
 const words=t?(t.match(/[A-Za-z][A-Za-z'’-]*/g)||[]).length:0;
 const low=t.toLowerCase();
 const pts=(l.points||[]).map(function(g){
  const keys=Array.isArray(g)?g:[g];
  return {label:keys[0],hit:keys.some(function(k){return keyHit(low,k)})};
 });
 const min=l.minWords||0;
 return {words:words,pts:pts,min:min,ok:words>=min&&pts.every(function(p){return p.hit})};
}
function questionsRatioOk(l,st){
 const qs=l.questions||[];if(!qs.length)return true;
 const done=st.answers.filter(function(a){return a!==null&&a!==undefined}).length;
 if(done<qs.length)return false;
 const right=st.answers.filter(function(a,i){return a===l.questions[i].answer}).length;
 st.score={right:right,total:qs.length};
 return right/qs.length>=(l.passRatio||0.8);
}

}

document.addEventListener("keyup",function(e){if(e.target.id==="codeAnswer")updateEditor()});
document.addEventListener("click",function(e){if(e.target.id==="codeAnswer")updateEditor()});
document.addEventListener("selectionchange",function(){if(document.activeElement&&document.activeElement.id==="codeAnswer")updateEditor()});
document.addEventListener("scroll",function(e){if(e.target&&e.target.id==="codeAnswer"){const h=document.getElementById("codeHighlight"),g=document.getElementById("editorLineNumbers");if(h)h.style.transform="translate("+(-e.target.scrollLeft)+"px,"+(-e.target.scrollTop)+"px)";if(g)g.style.transform="translateY("+(-e.target.scrollTop)+"px)"}},true);
document.addEventListener("pointermove",function(e){const card=e.target.closest(".level-card");if(!card)return;const r=card.getBoundingClientRect();card.style.setProperty("--shine-x",((e.clientX-r.left)/r.width*100)+"%");card.style.setProperty("--shine-y",((e.clientY-r.top)/r.height*100)+"%")},{passive:true});
/* 指针靠近自动抬起效果已移除（用户要求关闭） */

render();
(function(){
 const splash=document.getElementById("splash-screen"),skip=document.getElementById("splash-skip"),app=document.querySelector(".app");if(!splash||!app)return;
 let launched=false;const reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
 const targetSelector=".sidebar,.topbar,.brand,.nav-btn,.side-card,.streak,.avatar,.page-header,.hero-main,.hero-progress,.stat,.course-card,.course-entry,.section-head,.course-route-heading,.track-head,.track,.level-card,.panel,.summary-hero,.footer-note,.lesson-layout,.exercise,.about-panel";

 function revealInterface(){
  if(launched)return;launched=true;window.clearTimeout(revealTimer);window.clearTimeout(skipTimer);
  const targets=Array.from(app.querySelectorAll(targetSelector)).filter(function(el){return !el.parentElement.closest(targetSelector)});
  targets.forEach(function(el,index){
   el.style.setProperty("--drop-delay",(index*72+(Math.random()*55|0))+"ms");
   if(el.classList.contains("sidebar")||el.classList.contains("topbar")){
    el.classList.add("slide-across");return;
   }
   el.classList.add("drop-in");
   el.style.setProperty("--drop-from",(-70-Math.random()*55).toFixed(0)+"vh");
   el.style.setProperty("--drop-rot",((Math.random()*2-1)*4).toFixed(1)+"deg");
  });
  app.classList.add("interface-reveal");document.body.classList.remove("splash-active");splash.classList.add("is-leaving");window.removeEventListener("keydown",onSplashKey);
  window.setTimeout(function(){splash.remove()},520);
  if(!reduced){window.setTimeout(dropFinalLogo,240);}
  window.setTimeout(function(){app.classList.remove("interface-reveal");targets.forEach(function(el){el.classList.remove("drop-in");el.classList.remove("slide-across");el.style.removeProperty("--drop-delay")})},4800);
 }
 function dropFinalLogo(){
  var el=document.createElement("div");el.className="final-logo";el.setAttribute("aria-hidden","true");el.textContent="HT";
  document.body.appendChild(el);
  window.setTimeout(function(){el.remove()},3300);
 }
 function onSplashKey(event){if(event.key==="Escape")revealInterface()}
 const skipTimer=window.setTimeout(function(){splash.classList.add("can-skip")},reduced?0:1100);
 const revealTimer=window.setTimeout(revealInterface,reduced?120:1400);

 if(skip)skip.addEventListener("click",revealInterface);window.addEventListener("keydown",onSplashKey);
})();

/* ==== 外观设置（可调节，保存在本机） ==== */
const AP_KEY="cquest.appearance.v1";
const AP_DEF={sky:"noon",blur:24,tint:54,radius:22,noise:3.0,edge:72};
const AP_SKY={dawn:{glyph:"☀",name:"晨曦"},noon:{glyph:"◐",name:"正午"},dusk:{glyph:"☾",name:"黄昏"},night:{glyph:"★",name:"夜空"}};
function apLoad(){try{return Object.assign({},AP_DEF,JSON.parse(localStorage.getItem(AP_KEY)||"{}"))}catch(e){return Object.assign({},AP_DEF)}}
function apSave(a){try{localStorage.setItem(AP_KEY,JSON.stringify(a))}catch(e){}}
function apApply(a){
 const h=document.documentElement;a=a||apLoad();
 h.setAttribute("data-sky",AP_SKY[a.sky]?a.sky:"noon");
 h.style.setProperty("--glass-blur",a.blur+"px");
 h.style.setProperty("--glass-alpha",(a.tint/100).toFixed(2));
 h.style.setProperty("--glass-alpha-n",Math.max(.06,(a.tint/100)*0.22).toFixed(2));
 h.style.setProperty("--r-xl",(Number(a.radius)+8)+"px");
 h.style.setProperty("--r-l",a.radius+"px");
 h.style.setProperty("--r-m",Math.max(9,Number(a.radius)-6)+"px");
 h.style.setProperty("--noise",(a.noise/100).toFixed(3));
 h.style.setProperty("--edge",(a.edge/100).toFixed(2));
 window.__ap=a;
}
function apPatch(patch){const a=Object.assign(apLoad(),patch);apSave(a);apApply(a);apRefresh();}
function apReset(){try{localStorage.removeItem(AP_KEY)}catch(e){}apApply(apLoad());apRefresh();toast("外观已恢复默认。")}
function apCycleSky(){const keys=["dawn","noon","dusk","night"];const cur=(window.__ap||apLoad()).sky;const next=keys[(keys.indexOf(cur)+1)%4];apPatch({sky:next});toast("天空：" + AP_SKY[next].name);}
function apToggleSheet(){const el=document.getElementById("apSheet");if(!el)return;el.classList.toggle("open");if(el.classList.contains("open"))apRefresh()}
function apRefresh(){
 const a=window.__ap||apLoad();
 const el=document.getElementById("apSheet");if(!el)return;
 const set=(sel,v)=>{const n=el.querySelector(sel);if(n)n.textContent=v};
 set("#apBlurV",a.blur+"px");set("#apTintV",a.tint+"%");set("#apRadV",a.radius+"px");set("#apNoiseV",a.noise+"%");set("#apEdgeV",a.edge+"%");
 ["dawn","noon","dusk","night"].forEach(function(k){const b=el.querySelector('[data-sky="'+k+'"]');if(b)b.classList.toggle("on",a.sky===k)});
}
function apBuild(){
 try{apApply(apLoad())}catch(e){}
 if(document.getElementById("apFab"))return;
 const fab=document.createElement("button");fab.id="apFab";fab.className="ap-fab";fab.type="button";
 fab.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.2v2.2M12 18.6v2.2M3.2 12h2.2M18.6 12h2.2M5.8 5.8l1.6 1.6M16.6 16.6l1.6 1.6M18.2 5.8l-1.6 1.6M7.4 16.6l-1.6 1.6"/></svg><span>外观</span>';
 fab.addEventListener("click",apToggleSheet);
 document.body.appendChild(fab);
 const sheet=document.createElement("div");sheet.id="apSheet";sheet.className="ap-sheet";
 sheet.innerHTML='<div class="ap-title">外观设置 · 可调</div>'
  +'<div class="ap-row"><div class="ap-label"><span>天空</span><b id="apSkyV"></b></div><div class="ap-sky">'
  +'<button class="ap-chip" data-sky="dawn" type="button">晨曦</button>'
  +'<button class="ap-chip" data-sky="noon" type="button">正午</button>'
  +'<button class="ap-chip" data-sky="dusk" type="button">黄昏</button>'
  +'<button class="ap-chip" data-sky="night" type="button">夜空</button></div></div>'
  +'<div class="ap-row"><div class="ap-label"><span>玻璃模糊</span><b id="apBlurV"></b></div><input class="ap-range" id="apBlur" type="range" min="0" max="40" step="1"></div>'
  +'<div class="ap-row"><div class="ap-label"><span>玻璃不透明度</span><b id="apTintV"></b></div><input class="ap-range" id="apTint" type="range" min="20" max="85" step="1"></div>'
  +'<div class="ap-row"><div class="ap-label"><span>圆角</span><b id="apRadV"></b></div><input class="ap-range" id="apRad" type="range" min="10" max="34" step="1"></div>'
  +'<div class="ap-row"><div class="ap-label"><span>噪点</span><b id="apNoiseV"></b></div><input class="ap-range" id="apNoise" type="range" min="0" max="8" step="0.5"></div>'
  +'<div class="ap-row"><div class="ap-label"><span>边缘高光</span><b id="apEdgeV"></b></div><input class="ap-range" id="apEdge" type="range" min="0" max="100" step="1"></div>'
  +'<div class="ap-actions"><button class="ap-btn" id="apReset" type="button">恢复默认</button><button class="ap-btn" id="apClose" type="button">收起</button></div>'
  +'<div class="ap-note">设置只保存在这台设备的浏览器里。天空预设同时决定深浅色。</div>';
 document.body.appendChild(sheet);
 const a=apLoad();
 /* 事件委托：面板内所有交互统一处理，避免逐元素绑定失效 */
 sheet.addEventListener("click",function(e){
  var chip=e.target.closest(".ap-chip");
  if(chip&&chip.dataset.sky){apPatch({sky:chip.dataset.sky});return}
  if(e.target.closest("#apReset")){apReset();return}
  if(e.target.closest("#apClose")){apToggleSheet();return}
 });
 sheet.addEventListener("input",function(e){
  var map={apBlur:"blur",apTint:"tint",apRad:"radius",apNoise:"noise",apEdge:"edge"};
  var key=map[e.target.id];if(!key)return;
  var o={};o[key]=Number(e.target.value);apPatch(o);
 });
 document.addEventListener("click",function(e){
  var sh=document.getElementById("apSheet");if(!sh||!sh.classList.contains("open"))return;
  var fabEl=document.getElementById("apFab");
  if(sh.contains(e.target)||(fabEl&&fabEl.contains(e.target)))return;
  sh.classList.remove("open");
 });
 apRefresh();
 apApply(apLoad());
}
/* 定义完成后再初始化外观面板 */
try{apBuild()}catch(e){console.error("外观面板初始化失败",e)}


/* ==== 指针跟随倾斜（卡片随鼠标位置转动） ==== */
(function(){
 if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 var SEL=".level-card,.course-card,.stat,.course-entry,.side-card,.guide-card,.skill-row,.summary-hero";
 var MAX_X=7,MAX_Y=9;
 var active=null,frame=0,px=0,py=0;
 function paint(){
  frame=0;
  if(!active)return;
  var r=active.getBoundingClientRect();
  if(!r.width||!r.height)return;
  var nx=(px-r.left)/r.width, ny=(py-r.top)/r.height;
  if(nx<-.22||nx>1.22||ny<-.22||ny>1.22)return;
  active.style.setProperty("--ry",((nx-.5)*MAX_Y*2).toFixed(2)+"deg");
  active.style.setProperty("--rx",((.5-ny)*MAX_X*2).toFixed(2)+"deg");
  active.style.setProperty("--gx",(nx*100).toFixed(1)+"%");
  active.style.setProperty("--gy",(ny*100).toFixed(1)+"%");
 }
 function leave(){
  if(active){
   active.classList.remove("tilting");
   active.style.setProperty("--rx","0deg");
   active.style.setProperty("--ry","0deg");
   active=null;
  }
 }
 document.addEventListener("pointermove",function(e){
  if(e.pointerType&&e.pointerType!=="mouse")return;
  var card=e.target.closest?e.target.closest(SEL):null;
  if(card!==active){leave();active=card;if(active)active.classList.add("tilting")}
  if(!active)return;
  px=e.clientX;py=e.clientY;
  if(!frame)frame=requestAnimationFrame(paint);
 },{passive:true});
 document.addEventListener("pointerout",function(e){ if(!e.relatedTarget)leave(); },true);
 document.addEventListener("pointercancel",leave,true);
 window.addEventListener("blur",leave);
 document.addEventListener("scroll",function(){ if(active){var r=active.getBoundingClientRect();if(r.bottom<0||r.top>window.innerHeight)leave();} },{passive:true});
})();
</script>
