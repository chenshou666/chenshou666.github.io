<!doctype html>
<html data-sky="noon" lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111a31">
<title>HT Lab</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<style>
:root{--ink:#17243b;--muted:#77849a;--line:#e8edf4;--paper:#fff;--wash:#f5f7fb;--blue:#4e6cf5;--blue-dark:#354fe0;--mint:#dff8ef;--green:#168761;--amber:#f2a93b;--rose:#faedf0;--shadow:0 12px 38px rgba(35,54,91,.07);--radius:20px}
*{box-sizing:border-box}
body{margin:0;background:var(--wash);color:var(--ink);font:15px/1.65 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;background:#111a31;border-right:1px solid #27314a;padding:26px 17px;display:flex;flex-direction:column;z-index:5}
.brand{display:flex;align-items:center;gap:11px;padding:1px 8px 30px}
.brand-mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#f3f8ff 0%,#c8dcff 52%,#a9c7ff 100%);color:#fff;display:grid;place-items:center;box-shadow:0 8px 23px rgba(83,123,204,.28),inset 0 1px rgba(255,255,255,.92)}
.brand-mark svg{width:36px;height:36px;display:block}
.brand-name{font-size:16px;font-weight:850;letter-spacing:.15px;color:#f4f7ff}
.brand-sub{font-size:10px;color:#9ba9c4;margin-top:2px;letter-spacing:.8px}
.nav-label{font-size:10px;font-weight:800;color:#7887a5;letter-spacing:1.4px;padding:8px 12px 10px;text-transform:uppercase}
.nav{display:grid;gap:6px}
.nav-btn{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#aab6cf;text-align:left;padding:12px 13px;border-radius:12px;font-weight:650;transition:.18s}
.nav-btn:hover{background:#1b2945;color:#fff}
.nav-btn.active{background:linear-gradient(100deg,#25385f,#213254);color:#fff;box-shadow:inset 3px 0 #86a0ff}
.nav-icon{width:20px;text-align:center;font-size:17px}
.side-bottom{margin-top:auto}
.side-card{border:1px solid #2a3a5b;background:linear-gradient(145deg,#182743,#1d2d4c);border-radius:16px;padding:15px;color:#f2f5fc}
.side-card strong{font-size:13px}
.side-card p{font-size:12px;color:#a9b5cb;margin:6px 0 12px}
.side-mini{font-size:11px;color:#8190ae;margin-top:15px;padding:0 7px}
.main{min-width:0}
.topbar{height:72px;background:rgba(255,255,255,.84);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,54px);position:sticky;top:0;z-index:4}
.top-title{font-size:13px;color:#7d899c;font-weight:600}
.top-right{display:flex;align-items:center;gap:13px}.reset-button{white-space:nowrap;padding:7px 10px;font-size:11px}
.streak{border:1px solid var(--line);padding:7px 11px;border-radius:999px;background:#fff;font-size:12px;color:#6f7c90}
.avatar{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:#111a31;color:#f2bf58;box-shadow:0 5px 14px #17243b24}
.avatar svg{width:100%;height:100%;display:block}
.content{max-width:1180px;margin:auto;padding:35px clamp(20px,4vw,54px) 65px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#7888d8;font-weight:800}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(27px,3.3vw,40px);line-height:1.2;letter-spacing:-1.4px;margin:9px 0 9px}
h2{font-size:23px;letter-spacing:-.5px;margin-bottom:7px}
h3{font-size:16px;margin-bottom:6px}
.subhead{color:var(--muted);margin:0}
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(230px,.78fr);gap:20px;margin-bottom:23px}
.hero-main{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(122deg,#111a31 0%,#202f58 56%,#3c5ae0 100%);padding:32px 34px;color:#fff;min-height:258px;box-shadow:0 20px 48px #24396c35}
.hero-main:after{content:"";position:absolute;width:240px;height:240px;border:1px solid #ffffff24;border-radius:50%;right:-48px;top:-70px;box-shadow:0 0 0 28px #ffffff0c,0 0 0 58px #ffffff08}
.hero-main:before{content:"";position:absolute;width:120px;height:120px;border-radius:38px;transform:rotate(34deg);right:82px;bottom:-73px;background:#ffffff14}
.hero-main .eyebrow{color:#dce3ff}
.hero-main h1{max-width:570px}
.hero-main p{color:#e8ecff;max-width:550px;margin-bottom:22px}
.hero-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:750;transition:transform .16s,background .16s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 6px 15px #415ee52b}
.btn-primary:hover{background:var(--blue-dark)}
.hero-main .btn-primary{background:#fff;color:#354fe0;box-shadow:none}
.btn-soft{background:#f2f4ff;color:#5067dc}
.btn-ghost{background:transparent;color:#77849a;border:1px solid var(--line)}
.btn-small{padding:8px 12px;font-size:12px;border-radius:9px}
.hero-link{font-size:12px;color:#edf0ff;font-weight:650}
.hero-progress{background:#fff;border-radius:24px;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between}
.progress-top{display:flex;justify-content:space-between;align-items:flex-start}
.progress-kicker{color:var(--muted);font-size:12px}
.progress-number{font-size:30px;font-weight:800;letter-spacing:-1.5px;margin-top:3px}
.progress-ring{width:57px;height:57px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blue) var(--pct),#edf0f6 0);position:relative}
.progress-ring:before{content:"";position:absolute;inset:6px;background:#fff;border-radius:50%}
.progress-ring span{position:relative;font-size:13px;font-weight:800;color:var(--blue)}
.progress-bar{height:7px;background:#eef1f6;border-radius:8px;overflow:hidden;margin:13px 0 10px}
.progress-bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#546ef3,#39b898);transition:width .3s}
.progress-foot{display:flex;justify-content:space-between;font-size:11px;color:#94a0b1}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:29px}
.stat{background:#fff;border:1px solid #edf0f5;border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:12px}
.stat-icon{width:37px;height:37px;border-radius:12px;background:#eff2ff;color:#5268e6;display:grid;place-items:center;font-size:17px}
.stat:nth-child(2) .stat-icon{background:#fff4e2;color:#d99328}
.stat:nth-child(3) .stat-icon{background:#e6f8f1;color:#238e6a}
.stat:nth-child(4) .stat-icon{background:#f7edf8;color:#ad63ad}
.stat-num{font-size:19px;font-weight:800;line-height:1.1}
.stat-label{font-size:11px;color:#8b97a9;margin-top:4px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:0 0 14px}
.section-head p{color:var(--muted);font-size:13px;margin:0}
.course-library{margin:0 0 24px;padding:20px;border:1px solid rgba(255,255,255,.82);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(255,255,255,.42));box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.86);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%)}
.course-library-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
.course-library-head h2{margin:5px 0 4px;font-size:19px}
.course-library-head p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
.course-library-total{flex:none;padding:6px 10px;border-radius:999px;background:rgba(93,113,226,.1);color:#5268dc;font-size:10px;font-weight:800}
.course-entry{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto 20px;align-items:center;gap:13px;width:100%;min-height:76px;padding:13px 16px 17px;border:1px solid rgba(143,160,240,.27);border-radius:17px;background:linear-gradient(115deg,rgba(255,255,255,.9),rgba(236,241,255,.78));color:var(--ink);text-align:left;cursor:pointer;overflow:hidden;box-shadow:0 9px 24px rgba(49,67,131,.07),inset 0 1px #fff;transition:transform .26s cubic-bezier(.2,.8,.2,1),box-shadow .26s,border-color .26s}
.course-entry:hover{transform:translateY(-3px);border-color:rgba(105,126,239,.55);box-shadow:0 17px 34px rgba(49,67,131,.13),inset 0 1px #fff}
.course-entry:focus-visible{outline:3px solid rgba(89,112,235,.42);outline-offset:3px}
.course-entry-icon{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,#647df8,#435bdc);color:#fff;font-size:23px;font-weight:900;box-shadow:0 7px 16px rgba(68,91,221,.26),inset 0 1px rgba(255,255,255,.38)}
.course-entry-copy{display:grid;gap:4px;min-width:0}
.course-entry-copy strong{font-size:15px;letter-spacing:.01em}
.course-entry-copy small{overflow:hidden;color:#76839a;font-size:11px;text-overflow:ellipsis;white-space:nowrap}
.course-entry-progress{color:#75819a;font-size:10px;font-weight:750;white-space:nowrap}
.course-entry-arrow{color:#566fe5;font-size:20px;font-weight:700;transition:transform .2s}
.course-entry:hover .course-entry-arrow{transform:translate(2px,-2px)}
.course-entry-bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(100,119,223,.1)}
.course-entry-bar i{display:block;height:100%;border-radius:0 4px 4px 0;background:linear-gradient(90deg,#57c5a0,#7284f5);transition:width .6s ease}
.course-route{scroll-margin-top:82px}
.course-route-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px;padding:15px 17px;border:1px solid rgba(255,255,255,.78);border-radius:17px;background:linear-gradient(130deg,rgba(233,239,255,.76),rgba(255,255,255,.46));box-shadow:inset 0 1px rgba(255,255,255,.9)}
.course-route-heading-main{display:flex;align-items:center;gap:11px}
.course-route-heading h2{margin:0 0 3px;font-size:15px}
.course-route-heading p{margin:0;color:var(--muted);font-size:11px}
.course-route-icon{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#647df8,#435bdc);color:#fff;font-weight:900}
.track{margin-bottom:23px}
.track-head{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.track-dot{width:10px;height:10px;border-radius:50%;background:#697bf1;box-shadow:0 0 0 4px #697bf116}
.track-title{font-size:14px;font-weight:800}
.track-note{font-size:11px;color:#9aa5b5}
.level-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.level-card{background:#fff;border:1px solid #edf0f5;border-radius:16px;padding:16px;position:relative;transition:.2s;min-height:141px;cursor:pointer}
.level-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#dce2ff}
.level-card.locked{cursor:not-allowed;background:#fafbfd;opacity:.76}
.level-card.completed{border-color:#d7efe6;background:linear-gradient(145deg,#fff,#fafffd)}
.level-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.level-num{font-size:10px;font-weight:800;color:#8895a8;background:#f2f4f8;border-radius:7px;padding:4px 7px}
.level-state{font-size:14px}
.level-card h3{font-size:14px;margin:0 0 5px}
.level-card p{font-size:11px;color:#8a96a8;margin:0;line-height:1.55}
.level-meta{font-size:10px;color:#a1aabc;margin-top:11px}
.panel{background:#fff;border:1px solid #edf0f5;border-radius:20px;padding:23px;box-shadow:0 6px 22px #283c6705}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:23px}
.page-header .subhead{font-size:13px}
.lesson-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.75fr);gap:18px;align-items:start}
.lesson-main{display:grid;gap:15px}
.lesson-title-row{display:flex;align-items:center;gap:13px}
.lesson-badge{width:45px;height:45px;border-radius:14px;background:#edf0ff;display:grid;place-items:center;color:#5369e6;font-size:18px;font-weight:800}
.lesson-title-row h2{margin:0 0 3px}
.meta-line{font-size:11px;color:#909cad}
.lesson-copy{color:#526177;font-size:14px;line-height:1.85;white-space:pre-line}
.lesson-copy p:last-child{margin-bottom:0}
.codebox{border-radius:13px;background:#172238;color:#e7edf9;overflow:hidden}
.codebar{height:34px;border-bottom:1px solid #ffffff16;display:flex;align-items:center;justify-content:space-between;padding:0 13px;color:#aeb9cb;font-size:10px}
.dots{display:flex;gap:5px}
.dots i{width:7px;height:7px;background:#ff7774;border-radius:50%}
.dots i:nth-child(2){background:#f5c45d}.dots i:nth-child(3){background:#66d1a0}
pre{margin:0;padding:16px;overflow:auto;color:#dce6fb;font:12px/1.75 "SFMono-Regular",Consolas,"Liberation Mono",monospace;white-space:pre}
.takeaway{display:grid;gap:9px}
.takeaway-item{display:flex;gap:9px;font-size:12px;color:#647288}
.tick{color:#3ba883;font-weight:900}
.challenge-card{border-color:#e5e9ff}
.challenge-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.challenge-label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800}
.chip{font-size:10px;background:#eef0ff;color:#5368db;border-radius:999px;padding:5px 9px;font-weight:750}
.challenge-copy{font-size:13px;color:#5d6a7e;line-height:1.7}
.quiz-question{font-weight:700;font-size:14px;margin:10px 0 12px}
.option-list{display:grid;gap:8px}
.option{width:100%;text-align:left;background:#fff;border:1px solid #e8edf4;padding:10px 12px;border-radius:11px;font-size:12px;color:#55647a;transition:.15s}
.option:hover{border-color:#bac5ff;background:#fafbff}
.option.selected{border-color:#7486f6;background:#f0f2ff;color:#384fd0}
.option.correct{border-color:#80c8a9;background:#f2fbf6;color:#16704f}
.option.wrong{border-color:#e8a5ac;background:#fff5f6;color:#b44954}
.feedback{padding:10px 12px;border-radius:10px;font-size:12px;margin-top:11px}
.feedback.ok{background:#eaf8f1;color:#187450}
.feedback.no{background:#fff3f3;color:#ac4b55}
.exercise textarea{width:100%;min-height:145px;resize:vertical;border:1px solid #e2e7f0;border-radius:12px;padding:13px;background:#fbfcfe;color:#21314a;font:12px/1.65 "SFMono-Regular",Consolas,monospace;outline:none}
.exercise textarea:focus{border-color:#8594f6;box-shadow:0 0 0 3px #6077ef18}
.exercise-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.hint{font-size:11px;color:#7b89a0;margin-top:10px}
.lock-note{font-size:12px;color:#a0a9b7;background:#f7f8fb;padding:11px 13px;border-radius:10px}
.summary-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
.summary-hero{background:linear-gradient(120deg,#304de1,#657cf1);color:#fff;border-radius:22px;padding:25px 28px;position:relative;overflow:hidden}
.summary-hero h2{font-size:25px}
.summary-hero p{color:#e6eaff;font-size:13px;max-width:600px}
.summary-hero .summary-emoji{position:absolute;right:28px;top:25px;font-size:45px;opacity:.95}
.skill-list{display:grid;gap:9px}
.skill-row{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border:1px solid #edf0f5;border-radius:12px;font-size:12px}
.skill-state{color:#208260;font-weight:750}
.blank-state{padding:30px;text-align:center;color:#8995a7}
.footer-note{font-size:10px;color:#9ca6b4;text-align:center;margin-top:28px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#17243b;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;z-index:15;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.mobile-menu{display:none}
@media(max-width:980px){.app{grid-template-columns:215px minmax(0,1fr)}.hero{grid-template-columns:1fr}.hero-progress{min-height:170px}.level-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.reset-button{padding:5px 7px;font-size:9px}.top-right{gap:6px}.app{display:block}.sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:67px;padding:7px 9px;border-right:0;border-top:1px solid var(--line);display:block}.brand,.nav-label,.side-bottom{display:none}.nav{height:100%;display:flex;justify-content:space-around;gap:3px}.nav-btn{flex:1;justify-content:center;flex-direction:column;gap:1px;padding:4px 2px;font-size:9px}.nav-icon{font-size:16px}.topbar{height:60px;padding:0 12px}.top-title{max-width:72px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.streak{font-size:0;padding:7px 9px}.streak span{font-size:12px}.content{padding:24px 16px 92px}.hero-main{padding:25px 22px;min-height:270px}.hero-progress{padding:20px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:12px}.level-grid{grid-template-columns:1fr}.lesson-layout,.summary-grid{grid-template-columns:1fr}.page-header{align-items:flex-start;flex-direction:column}.panel{padding:18px}.hero-main h1{font-size:29px}.top-title{font-size:12px}}

/* ==== 英语四级课程：课程卡与任务组件 ==== */
.course-entry.is-active{border-color:rgba(105,126,239,.7);box-shadow:0 0 0 2px rgba(105,126,239,.25),0 17px 34px rgba(49,67,131,.13)}
.course-chooser{margin:0 0 22px;padding:22px;background:linear-gradient(140deg,rgba(255,255,255,.86),rgba(233,240,255,.6))}
body[data-theme="dark"] .course-chooser{background:linear-gradient(140deg,rgba(38,52,80,.95),rgba(28,40,64,.92))}
.course-tag.current{background:rgba(90,116,235,.16);color:#5067dc}
.course-tag{display:inline-block;margin-left:6px;font-size:9px;font-weight:800;padding:2px 7px;border-radius:999px;background:rgba(148,163,184,.22);color:#7b89a4;vertical-align:middle}
.audio-row{border:1px solid rgba(143,160,240,.27);border-radius:14px;padding:11px 13px;margin:11px 0;background:rgba(255,255,255,.62);box-shadow:inset 0 1px rgba(255,255,255,.7)}
body[data-theme="dark"] .audio-row{background:rgba(45,59,88,.62);border-color:rgba(145,164,255,.2);box-shadow:inset 0 1px rgba(255,255,255,.06)}
.audio-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.audio-label{font-weight:800;font-size:13px}
.audio-hint{font-size:11px;color:var(--muted)}
.chip-mini{font-size:9px;padding:2px 7px}
.audio-row audio{width:100%;height:36px}
.transcript{margin-top:9px;padding:11px 13px;border-radius:11px;background:rgba(120,140,220,.1);font-size:12.5px;line-height:1.75;white-space:pre-wrap}
.passage{margin:8px 0 4px;padding:15px 17px;border-radius:14px;background:rgba(120,140,220,.08);font-size:13.5px;line-height:1.9;white-space:pre-wrap}
body[data-theme="dark"] .passage{background:rgba(70,90,140,.22)}
.quiz-item{border-top:1px dashed rgba(140,155,200,.35);padding-top:14px;margin-top:14px}
.quiz-item:first-child{border-top:0;padding-top:0;margin-top:0}
.task-input{width:100%;min-height:190px;margin-top:11px;padding:13px 14px;border-radius:14px;border:1px solid rgba(143,160,240,.35);background:rgba(255,255,255,.86);color:inherit;font:14px/1.75 inherit;resize:vertical}
body[data-theme="dark"] .task-input{background:rgba(38,50,76,.85);border-color:rgba(145,164,255,.22)}
.task-input:focus{outline:3px solid rgba(89,112,235,.28);outline-offset:2px}
.wordcount{margin-top:8px;font-size:12px;color:var(--muted)}
.point-list{display:grid;gap:6px;margin-top:11px}
.point-item{display:flex;gap:8px;align-items:flex-start;font-size:12.5px}
.point-ok{color:#12a06a;font-weight:900}
.point-no{color:#d16666;font-weight:900}
.recorder-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.recorder-row audio{flex:1 1 240px;height:36px}
.rec-dot{width:10px;height:10px;border-radius:50%;background:#e35d5d;animation:recPulse 1s infinite}
@keyframes recPulse{50%{opacity:.2}}
.self-check{width:100%;text-align:left;border:1px solid rgba(143,160,240,.28);border-radius:12px;background:rgba(255,255,255,.55);padding:10px 12px;margin:6px 0;cursor:pointer;font:inherit;color:inherit}
.self-check.on{border-color:rgba(35,160,110,.6);background:rgba(35,160,110,.1)}
body[data-theme="dark"] .self-check{background:rgba(45,59,88,.6);border-color:rgba(145,164,255,.2)}
.option[disabled]{cursor:default;opacity:.92}
/* ==== 学习课程：课程卡片 ==== */
.course-cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin:0 0 18px}
.course-card{display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:14px;padding:20px;border-radius:20px;border:1px solid rgba(143,160,240,.3);background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(233,240,255,.8));box-shadow:0 14px 34px rgba(49,67,131,.1),inset 0 1px #fff;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .22s,box-shadow .22s,border-color .22s}
.course-card:hover{transform:translateY(-3px);border-color:rgba(105,126,239,.6);box-shadow:0 20px 40px rgba(49,67,131,.16)}
.course-card.is-soon{opacity:.62;cursor:not-allowed}
.course-card-icon{display:grid;place-items:center;width:56px;height:56px;border-radius:18px;background:linear-gradient(145deg,#647df8,#435bdc);color:#fff;font-size:26px;font-weight:900;box-shadow:0 8px 18px rgba(68,91,221,.28),inset 0 1px rgba(255,255,255,.4)}
.course-card-body{display:grid;gap:5px;min-width:0}
.course-card-body strong{font-size:17px}
.course-card-body small{font-size:12px;color:var(--muted);line-height:1.6}
.course-card-meta{font-size:11px;color:#7b89a4;font-weight:700}
.course-card-bar{display:block;height:4px;border-radius:999px;background:rgba(100,119,223,.14);overflow:hidden;margin-top:4px}
.course-card-bar i{display:block;height:100%;background:linear-gradient(90deg,#57c5a0,#7284f5);border-radius:999px}
.course-card-go{color:#566fe5;font-weight:800;font-size:13px;white-space:nowrap}
body[data-theme="dark"] .course-card{background:linear-gradient(135deg,rgba(45,59,88,.96),rgba(33,48,76,.92));border-color:rgba(145,164,255,.2);box-shadow:0 14px 34px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.07)}
body[data-theme="dark"] .course-card-body small{color:#a6b3cb}
body[data-theme="dark"] .course-card-meta{color:#93a2bd}

/* Startup: show the code mark, spin its edge, then reveal the real interface cards from that point. */
body.splash-active{overflow:hidden}
body.splash-active .app{visibility:hidden}
.splash-screen{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;overflow:hidden;color:#20395f;background:radial-gradient(ellipse at 50% 35%,rgba(255,255,255,.96),rgba(226,238,255,.88) 42%,rgba(197,218,250,.96) 100%);opacity:1;visibility:visible;transition:opacity .48s ease,visibility .48s ease}
.splash-screen.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
.splash-screen::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(86,125,190,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(86,125,190,.075) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(ellipse at center,black 12%,transparent 78%);opacity:0;animation:splash-grid-in .45s .68s ease-out forwards}
.splash-screen::after{content:"";position:absolute;left:0;right:0;top:-10%;height:1px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(92,145,231,.65),rgba(255,255,255,.9),rgba(92,145,231,.65),transparent);box-shadow:0 0 18px rgba(92,145,231,.42);animation:splash-scan 1.8s .82s ease-out 1 forwards}
body[data-theme="dark"] .splash-screen{color:#edf4ff;background:radial-gradient(ellipse at 50% 36%,rgba(55,79,125,.88),rgba(24,39,69,.96) 48%,#10182a 100%)}
body[data-theme="dark"] .splash-screen::before{background-image:linear-gradient(rgba(184,207,255,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(184,207,255,.075) 1px,transparent 1px)}
.splash-skip{position:absolute;top:24px;right:28px;z-index:2;padding:9px 14px;border:1px solid rgba(255,255,255,.8);border-radius:999px;background:rgba(255,255,255,.4);color:inherit;font-family:inherit;font-size:12px;font-weight:600;line-height:1.2;letter-spacing:.2px;cursor:pointer;opacity:0;visibility:hidden;backdrop-filter:blur(12px);transition:opacity .2s,visibility .2s,background .2s,border-color .2s,box-shadow .2s}
.splash-screen.can-skip .splash-skip{opacity:1;visibility:visible}
.splash-skip:hover{background:rgba(255,255,255,.72);border-color:#fff;box-shadow:0 5px 18px rgba(68,101,164,.12)}
body[data-theme="dark"] .splash-skip{background:rgba(255,255,255,.08);border-color:rgba(220,232,255,.24)}
.splash-content{position:relative;z-index:1;display:grid;place-items:center}
.splash-logo-stage{position:relative;width:132px;height:132px;display:grid;place-items:center}
.splash-orbit{position:absolute;inset:1px;border:2px solid rgba(81,124,196,.2);border-top-color:#fff;border-right-color:rgba(93,139,224,.95);border-bottom-color:rgba(93,139,224,.5);border-radius:50%;opacity:0;box-shadow:0 0 18px rgba(93,139,224,.18);animation:splash-orbit-appear .36s .62s ease-out forwards,splash-orbit-spin 1.15s .62s linear infinite}
.splash-orbit::after{content:"";position:absolute;top:13px;left:18px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 14px 3px rgba(78,125,213,.66)}
.splash-mark{position:relative;width:92px;height:92px;display:grid;place-items:center;overflow:hidden;border:1px solid rgba(255,255,255,.92);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.8),rgba(213,231,255,.57));box-shadow:0 18px 42px rgba(62,98,165,.2),inset 0 1px rgba(255,255,255,.98),inset 0 -8px 18px rgba(113,158,226,.13);backdrop-filter:blur(14px) saturate(145%)}
.splash-mark::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(112deg,transparent 20%,rgba(255,255,255,.66) 45%,rgba(255,255,255,.1) 57%,transparent 72%);transform:translateX(-130%);animation:splash-glass-sweep 1.8s .72s ease-in-out 1 forwards}
.splash-code{position:relative;z-index:1;font:850 40px/1 "Segoe UI",Inter,Arial,sans-serif;letter-spacing:-1.5px;background:linear-gradient(180deg,#111a31 0%,#22325c 45%,#2f4bd8 100%);background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-stroke:.7px rgba(255,255,255,.82);filter:drop-shadow(0 2px 2px rgba(53,87,143,.22))}
.app.interface-reveal .drop-in{will-change:translate,opacity;animation:interface-card-drop .74s cubic-bezier(.2,.72,.22,1) var(--drop-delay,0ms) both}
@keyframes splash-grid-in{to{opacity:.72}}
@keyframes splash-orbit-appear{to{opacity:1}}
@keyframes splash-orbit-spin{to{transform:rotate(360deg)}}
@keyframes splash-glass-sweep{to{transform:translateX(130%)}}
@keyframes splash-scan{from{transform:translateY(-10vh)}to{transform:translateY(120vh)}}
@keyframes interface-card-drop{0%{opacity:0;translate:0 -112vh}62%{opacity:1;translate:0 15px}82%{translate:0 -5px}100%{opacity:1;translate:0 0}}
@media(max-width:600px){.splash-skip{top:16px;right:16px}.splash-logo-stage{width:116px;height:116px}.splash-mark{width:82px;height:82px;border-radius:25px}.splash-code{font-size:36px}}
@media(prefers-reduced-motion:reduce){.splash-screen::before,.splash-screen::after,.splash-orbit,.splash-mark::before{animation:none}.splash-screen::before{opacity:.55}.splash-orbit{opacity:1}.splash-content{animation:none}.app.interface-reveal .drop-in{animation:none;translate:none;opacity:1;will-change:auto}}
/* ==== 开屏：转圈结束后，界面各组件落回自己的位置，最后 logo 落到底部 ==== */
/* 每个真实组件从上方随机高度、带一点角度落位（--drop-from / --drop-rot 由 JS 注入） */
.app.interface-reveal .drop-in{will-change:translate,opacity,rotate;animation:interface-card-drop .86s cubic-bezier(.22,.78,.2,1) var(--drop-delay,0ms) both}
@keyframes interface-card-drop{
  0%{opacity:0;translate:0 var(--drop-from,-110vh);rotate:var(--drop-rot,0deg)}
  58%{opacity:1;translate:0 12px;rotate:0deg}
  78%{translate:0 -4px}
  92%{translate:0 1px}
  100%{opacity:1;translate:0 0;rotate:0deg}
}
/* 收尾：网站 logo 落在页面底部 */
.final-logo{position:fixed;left:50%;bottom:5.5vh;z-index:9997;pointer-events:none;display:grid;place-items:center;
  width:92px;height:92px;border-radius:26px;
  background:linear-gradient(150deg,#ffffff,#dde9ff);
  border:1px solid rgba(255,255,255,.95);
  box-shadow:0 26px 60px rgba(38,68,140,.3),inset 0 1px #fff,inset 0 -10px 22px rgba(110,150,220,.16);
  font:900 38px/1 "Segoe UI",Inter,Arial,sans-serif;letter-spacing:-1.5px;color:#22398a;
  transform:translateX(-50%) translateY(-70vh) scale(.72) rotate(-8deg);opacity:0;
  animation:final-logo-drop 1.02s cubic-bezier(.2,.86,.28,1.02) .1s both,final-logo-out .5s ease 2.35s forwards}
@keyframes final-logo-drop{
  0%{transform:translateX(-50%) translateY(-70vh) scale(.72) rotate(-8deg);opacity:0}
  55%{opacity:1}
  82%{transform:translateX(-50%) translateY(6px) scale(1.02) rotate(0deg)}
  100%{transform:translateX(-50%) translateY(0) scale(1) rotate(0deg);opacity:1}
}
@keyframes final-logo-out{to{opacity:0;transform:translateX(-50%) translateY(-12px) scale(.9)}}
body[data-theme="dark"] .final-logo{background:linear-gradient(150deg,#2a3a60,#1b2846);border-color:rgba(150,175,235,.35);color:#dbe6ff;box-shadow:0 26px 60px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.1)}
@media(prefers-reduced-motion:reduce){.app.interface-reveal .drop-in{animation:none;translate:none;opacity:1}.final-logo{display:none}}



/* ==== Liquid Glass 设计系统 ==== */
:root{
  /* 天空（可切换预设，可被外观面板覆盖） */
  --sky-a:#8ec6ff;--sky-b:#c8e6ff;--sky-c:#f2f9ff;
  --cloud-a:rgba(255,255,255,.92);--cloud-b:rgba(255,255,255,.55);
  /* 玻璃 */
  --glass-alpha:.54;--glass-alpha-n:.12;
  --glass-tint:rgba(255,255,255,var(--glass-alpha));
  --glass-tint-2:rgba(255,255,255,var(--glass-alpha));
  --glass-blur:24px;--glass-sat:175%;
  --glass-border:rgba(255,255,255,.66);
  --glass-edge:rgba(255,255,255,.9);
  --glass-inner:rgba(255,255,255,.18);
  /* 形状与光影 */
  --r-xl:30px;--r-l:22px;--r-m:15px;--r-s:11px;
  --sh-soft:0 1px 2px rgba(20,44,86,.05),0 10px 28px rgba(20,44,86,.09);
  --sh-float:0 2px 8px rgba(20,44,86,.06),0 24px 64px rgba(20,44,86,.15);
  --sh-card:0 1px 1px rgba(20,44,86,.04),0 6px 18px rgba(20,44,86,.07);
  /* 文字与强调色 */
  --ink:#0d1a2c;--ink-2:#42597a;--ink-3:#8095b0;--ink-inv:#ffffff;
  --accent:#2f7cf6;--accent-2:#00b3a4;--accent-soft:rgba(47,124,246,.12);
  --line:rgba(255,255,255,.5);
  /* 可调参数 */
  --noise:.03;--edge:.72;--tilt:0deg;
}
/* 天空预设 */
html[data-sky="dawn"]{--sky-a:#f7c9d8;--sky-b:#ffe3c9;--sky-c:#fff7f0;--ink:#2a1b24;--ink-2:#6b5060;--ink-3:#9c8090;--accent:#e0708f;--accent-2:#f2a65a;--accent-soft:rgba(224,112,143,.14)}
html[data-sky="noon"]{--sky-a:#8ec6ff;--sky-b:#c8e6ff;--sky-c:#f2f9ff;--ink:#0d1a2c;--ink-2:#42597a;--ink-3:#8095b0;--accent:#2f7cf6;--accent-2:#00b3a4;--accent-soft:rgba(47,124,246,.12)}
html[data-sky="dusk"]{--sky-a:#8a86d8;--sky-b:#c9a9e0;--sky-c:#ffe0e6;--ink:#1b1633;--ink-2:#4d4470;--ink-3:#887fa8;--accent:#7c5cf6;--accent-2:#ff8f6b;--accent-soft:rgba(124,92,246,.14)}
html[data-sky="night"]{--sky-a:#0b1730;--sky-b:#16294d;--sky-c:#1f3a63;--ink:#eef4ff;--ink-2:#adc0dc;--ink-3:#7d92b3;--accent:#63a8ff;--accent-2:#5ee3d0;--accent-soft:rgba(99,168,255,.16);--glass-tint:rgba(255,255,255,var(--glass-alpha-n));--glass-tint-2:rgba(255,255,255,var(--glass-alpha-n));--glass-border:rgba(255,255,255,.28);--glass-edge:rgba(255,255,255,.5);--glass-inner:rgba(255,255,255,.08);--line:rgba(255,255,255,.22);--sh-soft:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.38);--sh-float:0 2px 10px rgba(0,0,0,.35),0 30px 70px rgba(0,0,0,.5);--sh-card:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.3)}

/* ---------- 画布：天空 + 云层 + 噪点 ---------- */
html,body{min-height:100%}
body{
  margin:0;padding:0;
  font-family:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",Inter,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:
    linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 46%,var(--sky-c) 100%) fixed!important;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body::before{ /* 云层：几张模糊柔光斑 */
  content:"";position:fixed;inset:-14%;z-index:0;pointer-events:none;
  background:
    radial-gradient(42% 30% at 16% 18%,var(--cloud-a),transparent 64%),
    radial-gradient(34% 24% at 78% 10%,var(--cloud-b),transparent 62%),
    radial-gradient(46% 32% at 64% 72%,var(--cloud-b),transparent 66%),
    radial-gradient(30% 22% at 24% 82%,var(--cloud-a),transparent 64%),
    radial-gradient(26% 18% at 92% 52%,var(--cloud-b),transparent 62%);
  filter:blur(34px) saturate(115%);
  opacity:.9;
  animation:cloud-drift 64s ease-in-out infinite alternate;
}
@keyframes cloud-drift{from{transform:translate3d(-1.4%,-0.8%,0) scale(1.02)}to{transform:translate3d(1.6%,1%,0) scale(1.05)}}
body::after{ /* 细腻噪点 */
  content:"";position:fixed;inset:0;z-index:2;pointer-events:none;
  opacity:var(--noise);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.92' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size:160px 160px;
  mix-blend-mode:overlay;
}
@media(prefers-reduced-motion:reduce){body::before{animation:none}}

/* ---------- 应用骨架：悬浮玻璃侧栏 + 透明主区 ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:238px minmax(0,1fr);gap:20px;padding:20px;min-height:100vh}
.sidebar{
  position:sticky;top:20px;height:calc(100vh - 40px);
  display:flex;flex-direction:column;
  padding:22px 16px!important;border-radius:var(--r-xl);
  background:var(--glass-tint);backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  border:1px solid var(--glass-border);
  box-shadow:var(--sh-float),inset 0 1px 0 var(--glass-edge),inset 0 -1px 0 rgba(255,255,255,.25);
}
.main{min-width:0;display:flex;flex-direction:column;gap:18px;padding:0 4px 0 0}
.topbar{
  position:sticky;top:20px;z-index:5;height:64px!important;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px 0 22px!important;
  border-radius:var(--r-l);
  background:var(--glass-tint-2);backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--glass-border);
  box-shadow:var(--sh-soft),inset 0 1px 0 var(--glass-edge);
}
.view{padding:6px 6px 40px!important;flex:1}

/* ---------- 玻璃卡片通用 ---------- */
.glass,.panel,.stat,.course-card,.level-card,.hero,.track,.course-route,.side-card,.victory-card,.summary-hero{
  position:relative;
  background:var(--glass-tint);
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat));
  border:1px solid var(--glass-border)!important;
  box-shadow:var(--sh-soft),inset 0 1px 0 var(--glass-edge)!important;
}
.panel::before,.stat::before,.course-card::before,.hero::before,.track::before,.level-card::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
  background:linear-gradient(146deg,rgba(255,255,255,.5),rgba(255,255,255,0) 34%,rgba(255,255,255,0) 66%,rgba(255,255,255,.26));
  opacity:var(--edge);mix-blend-mode:screen;
}
.panel>*,.stat>*,.course-card>*,.hero>*,.track>*,.level-card>*{position:relative;z-index:2}

/* ---------- 侧栏内容 ---------- */
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 18px}
.brand-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#f7fbff,#cfe2ff 55%,#a9c7ff);box-shadow:0 8px 20px rgba(52,96,180,.24),inset 0 1px rgba(255,255,255,.95);display:grid;place-items:center}
.brand-name{font-size:16.5px;font-weight:700;letter-spacing:-.3px;color:var(--ink)}
.nav-label{font-size:9.5px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--ink-3);padding:10px 4px 8px}
.nav{display:grid;gap:4px}
.nav-btn{display:flex;align-items:center;gap:11px;padding:11px 12px;border:0;background:transparent;border-radius:14px;color:var(--ink-2);font:inherit;font-size:13.5px;font-weight:600;text-align:left;cursor:pointer;transition:background .18s,color .18s,box-shadow .18s}
.nav-btn:hover{background:rgba(255,255,255,.34);color:var(--ink)}
.nav-btn.active{background:rgba(255,255,255,.62);color:var(--ink);box-shadow:0 1px 2px rgba(20,44,86,.06),0 8px 20px rgba(20,44,86,.1),inset 0 1px 0 rgba(255,255,255,.9)}
html[data-sky="night"] .nav-btn:hover{background:rgba(255,255,255,.1)}
html[data-sky="night"] .nav-btn.active{background:rgba(255,255,255,.16)}
.nav-icon{width:20px;height:20px;display:grid;place-items:center;color:currentColor;opacity:.9}
.nav-icon svg{width:18px;height:18px;display:block}
.side-bottom{margin-top:auto}
.side-card{border-radius:var(--r-l)!important;padding:15px!important}
.side-card strong{font-size:12.5px;color:var(--ink)}
.side-card p{font-size:11.5px;color:var(--ink-2);margin:6px 0 11px}
.side-mini{font-size:10.5px;color:var(--ink-3);margin-top:14px;padding:0 4px;line-height:1.7}

/* ---------- 顶栏内容 ---------- */
.top-title{font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--ink-3)!important}
.top-right{display:flex;align-items:center;gap:9px}
.streak{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:99px;background:rgba(255,255,255,.42);border:1px solid var(--glass-border);font-size:12px;font-weight:650;color:var(--ink);backdrop-filter:blur(8px)}
html[data-sky="night"] .streak{background:rgba(255,255,255,.1)}
.avatar{width:34px;height:34px;border-radius:11px;overflow:hidden;box-shadow:0 4px 14px rgba(20,44,86,.16),inset 0 1px rgba(255,255,255,.9)}

/* ---------- 页头 ---------- */
.eyebrow{font-size:9.5px!important;font-weight:700!important;letter-spacing:2.4px!important;text-transform:uppercase;color:var(--ink-3)!important}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:2px 0 18px}
.page-header h1{font-size:clamp(28px,3.3vw,40px)!important;font-weight:700!important;letter-spacing:-1.2px!important;line-height:1.1;color:var(--ink)!important;margin:6px 0 8px}
.subhead{font-size:13px!important;color:var(--ink-2)!important;max-width:60ch}

/* ---------- Hero ---------- */
.hero{border-radius:var(--r-xl)!important;padding:clamp(24px,3vw,36px)!important;overflow:hidden;box-shadow:var(--sh-float),inset 0 1px 0 var(--glass-edge)!important}
.hero::after{content:"";position:absolute;right:-12%;top:-50%;width:56%;height:200%;pointer-events:none;background:radial-gradient(circle at 50% 42%,var(--accent-soft),transparent 66%);z-index:1}
.hero h1{font-size:clamp(25px,3vw,36px)!important;font-weight:700!important;letter-spacing:-1px!important;line-height:1.16;color:var(--ink)!important}
.hero p{color:var(--ink-2)!important;font-size:13px!important}
.hero-actions{gap:10px!important}
.hero-link{font-size:11px!important;color:var(--ink-3)!important}
.hero-progress{background:rgba(255,255,255,.38)!important;border:1px solid var(--glass-border)!important;border-radius:var(--r-l)!important;padding:18px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)!important}
html[data-sky="night"] .hero-progress{background:rgba(255,255,255,.08)!important}
.progress-kicker{font-size:9.5px!important;letter-spacing:1.8px!important;text-transform:uppercase;color:var(--ink-3)!important}
.progress-number{font-size:32px!important;font-weight:700!important;letter-spacing:-1.2px;color:var(--ink)!important}
.progress-ring{background:conic-gradient(var(--accent) var(--pct,0%),rgba(255,255,255,.32) 0)!important;box-shadow:none!important}
.progress-ring span{font-size:11.5px!important;font-weight:700;color:var(--ink)!important}
.progress-bar{height:6px!important;border-radius:99px!important;background:rgba(255,255,255,.34)!important;overflow:hidden}
.progress-bar i{background:linear-gradient(90deg,var(--accent),var(--accent-2))!important;border-radius:99px}
.progress-foot{font-size:10.5px!important;color:var(--ink-3)!important}

/* ---------- 统计 ---------- */
.stats{gap:14px!important}
.stat{border-radius:var(--r-l)!important;padding:16px 18px!important;box-shadow:var(--sh-card),inset 0 1px 0 var(--glass-edge)!important}
.stat-icon{width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:14px}
.stat-num{font-size:25px!important;font-weight:700!important;letter-spacing:-1px;color:var(--ink)!important;font-variant-numeric:tabular-nums}
.stat-label{font-size:9.5px!important;letter-spacing:1.5px!important;text-transform:uppercase;color:var(--ink-3)!important;font-weight:650}

/* ---------- 区块标题 ---------- */
.section-head{margin:26px 0 14px}
.section-head h2{font-size:18px!important;font-weight:700!important;letter-spacing:-.3px;color:var(--ink)!important}
.section-head p{font-size:11.5px!important;color:var(--ink-3)!important}

/* ---------- 课程卡片 ---------- */
.course-cards{gap:16px!important}
.course-card{border-radius:var(--r-xl)!important;padding:20px!important;box-shadow:var(--sh-card),inset 0 1px 0 var(--glass-edge)!important;transition:transform .24s cubic-bezier(.2,.7,.2,1),box-shadow .24s}
.course-card:hover{transform:translateY(-4px) scale(1.005);box-shadow:var(--sh-float),inset 0 1px 0 var(--glass-edge)!important}
.course-card.is-active{border-color:rgba(255,255,255,.9)!important;box-shadow:var(--sh-float),0 0 0 2px var(--accent-soft),inset 0 1px 0 var(--glass-edge)!important}
.course-card-icon{border-radius:15px;box-shadow:0 8px 20px rgba(52,96,180,.22),inset 0 1px rgba(255,255,255,.5)}
.course-card-body strong{font-size:15.5px;color:var(--ink)}
.course-card-body small{font-size:11.5px;color:var(--ink-2)}
.course-card-meta{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3)}
.course-card-bar{height:3px!important;background:rgba(255,255,255,.4)!important}
.course-card-bar i{background:linear-gradient(90deg,var(--accent),var(--accent-2))!important}
.course-card-go{color:var(--accent)!important;font-size:12px!important;font-weight:650}

/* ---------- 路线 / 关卡 ---------- */
.course-route{border-radius:var(--r-xl)!important;padding:22px!important;box-shadow:var(--sh-card),inset 0 1px 0 var(--glass-edge)!important}
.course-route-heading h2{font-size:17px!important;font-weight:700!important;color:var(--ink)!important}
.course-route-heading p{font-size:11px!important;color:var(--ink-3)!important}
.track{border-radius:var(--r-l)!important;padding:18px!important;box-shadow:var(--sh-card),inset 0 1px 0 var(--glass-edge)!important;margin-top:14px}
.track-head{gap:8px}
.track-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.track-title{font-size:13.5px!important;font-weight:680;letter-spacing:-.1px;color:var(--ink)!important}
.track-note{font-size:9.5px!important;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3)!important}
.level-grid{gap:11px!important;margin-top:12px}
.level-card{border-radius:var(--r-m)!important;padding:13px!important;box-shadow:var(--sh-card),inset 0 1px 0 rgba(255,255,255,.7)!important;transition:transform .2s,box-shadow .2s}
.level-card:hover{transform:translateY(-2px);box-shadow:var(--sh-soft),inset 0 1px 0 var(--glass-edge)!important}
.level-card.completed{background:rgba(255,255,255,.62)!important;border-color:rgba(255,255,255,.85)!important}
html[data-sky="night"] .level-card.completed{background:rgba(255,255,255,.14)!important}
.level-num{font-size:10px!important;font-weight:700!important;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink-3)!important}
.level-card h3{font-size:13px!important;font-weight:650;letter-spacing:-.1px;color:var(--ink)!important}
.level-card p{font-size:11px!important;color:var(--ink-2)!important}
.level-meta{font-size:9px!important;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-3)!important}
.level-state{font-size:12px}

/* ---------- 面板 / 讲解 / 题目 ---------- */
.panel{border-radius:var(--r-l)!important;padding:20px!important;box-shadow:var(--sh-card),inset 0 1px 0 var(--glass-edge)!important}
.lesson-title-row h2{font-size:16.5px!important;font-weight:700!important;color:var(--ink)!important}
.meta-line{font-size:10.5px!important;color:var(--ink-3)!important}
.lesson-copy{font-size:13.5px!important;color:var(--ink-2)!important;line-height:1.85!important}
.challenge-label{font-size:10.5px!important;font-weight:700!important;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink)!important}
.challenge-copy{font-size:12.5px!important;color:var(--ink-2)!important}
.chip{background:rgba(255,255,255,.45)!important;border:1px solid var(--glass-border)!important;color:var(--ink-2)!important;font-size:9.5px!important;letter-spacing:1.1px;text-transform:uppercase;font-weight:650;border-radius:99px!important;padding:4px 10px!important}
html[data-sky="night"] .chip{background:rgba(255,255,255,.12)!important}
.takeaway-item{font-size:12.5px!important;color:var(--ink-2)}
.tick{color:var(--accent-2)!important}
.hint{background:rgba(255,255,255,.4)!important;border:1px dashed rgba(255,255,255,.7)!important;border-radius:var(--r-m)!important;color:var(--ink-2)!important;font-size:12px!important;padding:12px 14px!important}
html[data-sky="night"] .hint{background:rgba(255,255,255,.08)!important;border-color:rgba(255,255,255,.24)!important}

/* ---------- 按钮 ---------- */
.btn{border-radius:99px!important;font-weight:650!important;letter-spacing:.1px;transition:transform .18s,box-shadow .18s,background .18s}
.btn-primary{background:linear-gradient(180deg,#3f8bff,var(--accent))!important;color:#fff!important;border:1px solid rgba(255,255,255,.35)!important;box-shadow:0 6px 18px rgba(47,124,246,.34),inset 0 1px rgba(255,255,255,.4)!important}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(47,124,246,.42),inset 0 1px rgba(255,255,255,.45)!important}
.btn-ghost{background:rgba(255,255,255,.42)!important;border:1px solid var(--glass-border)!important;color:var(--ink)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)!important}
.btn-ghost:hover{background:rgba(255,255,255,.6)!important}
html[data-sky="night"] .btn-ghost{background:rgba(255,255,255,.12)!important;color:var(--ink)!important}
.btn-soft{background:var(--accent-soft)!important;border:1px solid rgba(255,255,255,.6)!important;color:var(--accent)!important}

/* ---------- 代码区 ---------- */
.codebox,.ide-frame{border-radius:var(--r-m)!important;border:1px solid var(--glass-border)!important;box-shadow:var(--sh-card)!important;overflow:hidden;background:rgba(255,255,255,.4)!important}
.codebar,.ide-toolbar{background:rgba(255,255,255,.34)!important;border-bottom:1px solid rgba(255,255,255,.5)!important;color:var(--ink-3)!important;font-size:10px!important;letter-spacing:1px;text-transform:uppercase}
.ide-gutter{background:rgba(255,255,255,.26)!important;color:var(--ink-3)!important;border-right:1px solid rgba(255,255,255,.4)!important}
.codebox pre,.ide-highlight{color:#1b2b45}
html[data-sky="night"] .codebox,html[data-sky="night"] .ide-frame{background:rgba(8,16,30,.55)!important}
html[data-sky="night"] .codebox pre,html[data-sky="night"] .ide-highlight{color:#dbe8ff}
html[data-sky="night"] .codebar,html[data-sky="night"] .ide-toolbar,html[data-sky="night"] .ide-gutter{background:rgba(255,255,255,.08)!important;color:var(--ink-3)!important}

/* ---------- 选项 / 输入 / 反馈 ---------- */
.option{border-radius:var(--r-m)!important;border:1px solid var(--glass-border)!important;background:rgba(255,255,255,.44)!important;color:var(--ink)!important;font-size:13px!important;padding:12px 14px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)!important;transition:.16s}
.option:hover{background:rgba(255,255,255,.6)!important}
.option.selected{border-color:var(--accent)!important;background:var(--accent-soft)!important;box-shadow:0 0 0 1px var(--accent),inset 0 1px 0 rgba(255,255,255,.6)!important}
.option.correct{border-color:rgba(0,179,164,.7)!important;background:rgba(0,179,164,.14)!important}
.option.wrong{border-color:rgba(255,110,110,.7)!important;background:rgba(255,110,110,.12)!important}
html[data-sky="night"] .option{background:rgba(255,255,255,.1)!important}
.quiz-question{font-size:13.5px!important;font-weight:650!important;color:var(--ink)!important}
.task-input,.passage,#runOutput{border-radius:var(--r-m)!important;border:1px solid var(--glass-border)!important;background:rgba(255,255,255,.46)!important;color:var(--ink)!important;font-size:13px!important;padding:12px 14px!important}
.task-input:focus,#runOutput:focus{outline:none;border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accent-soft)!important}
html[data-sky="night"] .task-input,html[data-sky="night"] .passage,html[data-sky="night"] #runOutput{background:rgba(255,255,255,.08)!important}
.feedback{border-radius:var(--r-m)!important;font-size:12.5px!important}
.feedback.ok{background:rgba(0,179,164,.14)!important;color:#08776d!important;border:1px solid rgba(0,179,164,.28)!important}
.feedback.no{background:rgba(255,110,110,.12)!important;color:#b23a3a!important;border:1px solid rgba(255,110,110,.28)!important}
html[data-sky="night"] .feedback.ok{color:#8ff0e2!important}
html[data-sky="night"] .feedback.no{color:#ffb4b4!important}

/* ---------- 开屏适配 ---------- */
.splash-screen{background:linear-gradient(180deg,var(--sky-a),var(--sky-b) 46%,var(--sky-c))!important;color:var(--ink)!important}
.splash-mark{background:rgba(255,255,255,.5)!important;border:1px solid rgba(255,255,255,.7)!important;box-shadow:0 24px 60px rgba(30,60,120,.2),inset 0 1px rgba(255,255,255,.9)!important;backdrop-filter:blur(20px) saturate(160%)!important}
.splash-code{background:linear-gradient(180deg,#2b4468,#5b86d6)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important;-webkit-text-stroke:0!important}
.splash-skip{background:rgba(255,255,255,.44)!important;border:1px solid rgba(255,255,255,.7)!important;color:var(--ink)!important;backdrop-filter:blur(12px)}
.final-logo{background:rgba(255,255,255,.6)!important;border:1px solid rgba(255,255,255,.8)!important;color:#2b4468!important;backdrop-filter:blur(18px) saturate(160%)!important;box-shadow:0 26px 60px rgba(30,60,120,.24),inset 0 1px rgba(255,255,255,.9)!important}

/* ---------- 页脚 / 提示 ---------- */
.footer-note{font-size:10.5px!important;color:var(--ink-3)!important;border-top:1px solid rgba(255,255,255,.45);padding-top:14px;margin-top:26px;letter-spacing:.3px}
.toast{background:rgba(20,32,54,.86)!important;color:#fff!important;backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.24)!important;border-radius:99px!important;box-shadow:0 16px 40px rgba(10,22,44,.3)!important}
.victory-card{background:var(--glass-tint)!important;border-radius:var(--r-xl)!important;box-shadow:var(--sh-float),inset 0 1px 0 var(--glass-edge)!important;backdrop-filter:blur(24px) saturate(160%)}

/* ---------- 响应式 ---------- */
@media(max-width:980px){
  .app{grid-template-columns:1fr;gap:14px;padding:14px}
  .sidebar{position:relative;top:0;height:auto;flex-direction:row;align-items:center;gap:10px;padding:14px!important;border-radius:var(--r-l)}
  .sidebar .nav{display:flex;gap:6px;overflow:auto}
  .nav-label,.side-bottom{display:none}
  .view{padding:0 0 30px!important}
  .topbar{top:10px}
}

/* ==== 外观设置面板（可调节） ==== */
.ap-fab{position:fixed;right:22px;bottom:22px;z-index:60;display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:99px;border:1px solid var(--glass-border);background:rgba(255,255,255,.5);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);box-shadow:0 10px 30px rgba(20,44,86,.16),inset 0 1px 0 rgba(255,255,255,.8);color:var(--ink);font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;transition:.2s}
.ap-fab:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(20,44,86,.22),inset 0 1px 0 rgba(255,255,255,.9)}
.ap-fab svg{width:16px;height:16px}
html[data-sky="night"] .ap-fab{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.26);color:#eaf2ff}
.ap-sheet{position:fixed;right:22px;bottom:78px;z-index:61;width:300px;max-width:calc(100vw - 44px);padding:18px;border-radius:22px;border:1px solid var(--glass-border);background:rgba(255,255,255,.6);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);box-shadow:0 26px 70px rgba(20,44,86,.24),inset 0 1px 0 rgba(255,255,255,.9);color:var(--ink);opacity:0;visibility:hidden;transform:translateY(10px) scale(.98);transition:.22s cubic-bezier(.2,.7,.2,1)}
.ap-sheet.open{opacity:1;visibility:visible;transform:none}
html[data-sky="night"] .ap-sheet{background:rgba(14,24,42,.86);border-color:rgba(255,255,255,.22);color:#eaf2ff}
.ap-title{font-size:11px;font-weight:750;letter-spacing:1.8px;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
.ap-row{margin-bottom:14px}
.ap-label{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
.ap-label b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.ap-sky{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ap-chip{height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.7);cursor:pointer;font-size:10.5px;font-weight:650;color:#0d1a2c;transition:.16s;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.ap-chip:hover{transform:translateY(-1px)}
.ap-chip.on{outline:2px solid var(--accent);outline-offset:1px}
.ap-chip[data-sky="dawn"]{background:linear-gradient(180deg,#f7c9d8,#ffe3c9)}
.ap-chip[data-sky="noon"]{background:linear-gradient(180deg,#8ec6ff,#dff0ff)}
.ap-chip[data-sky="dusk"]{background:linear-gradient(180deg,#8a86d8,#ffd0d8)}
.ap-chip[data-sky="night"]{background:linear-gradient(180deg,#0b1730,#1f3a63);color:#dbe8ff}
.ap-range{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:99px;background:rgba(20,44,86,.16);outline:none}
.ap-range::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:1px solid rgba(20,44,86,.18);box-shadow:0 2px 8px rgba(20,44,86,.24);cursor:pointer}
.ap-actions{display:flex;gap:8px;margin-top:4px}
.ap-btn{flex:1;padding:9px;border-radius:12px;border:1px solid var(--glass-border);background:rgba(255,255,255,.5);color:var(--ink);font:inherit;font-size:11.5px;font-weight:650;cursor:pointer}
.ap-btn:hover{background:rgba(255,255,255,.7)}
.ap-note{font-size:10px;color:var(--ink-3);margin-top:10px;line-height:1.6}
html[data-sky="night"] .ap-btn{background:rgba(255,255,255,.12)}

/* ==== Liquid Glass 修正 ==== */
/* 主内容列：撑满主区，不再 shrink-to-fit */
.main{display:block!important}
#view.content{width:100%!important;max-width:1200px!important;margin:0 auto!important;padding:6px clamp(18px,3vw,40px) 48px!important;display:block}
/* 玻璃质感加强：更清晰的白、更亮的高光边、更明显的投影 */
:root{
  --glass-alpha:.6;
  --glass-border:rgba(255,255,255,.82);
  --glass-edge:rgba(255,255,255,1);
  --sh-soft:0 1px 2px rgba(24,48,90,.06),0 12px 32px rgba(24,48,90,.12);
  --sh-card:0 1px 2px rgba(24,48,90,.05),0 8px 22px rgba(24,48,90,.10);
  --sh-float:0 2px 10px rgba(24,48,90,.07),0 28px 70px rgba(24,48,90,.18);
}
/* 天空更有层次，云才看得见 */
:root{--sky-a:#7fbcf7;--sky-b:#bcdcff;--sky-c:#e9f4ff;--cloud-a:rgba(255,255,255,.96);--cloud-b:rgba(232,243,255,.86)}
html[data-sky="dawn"]{--sky-a:#f4b9cd;--sky-b:#ffd9bf;--sky-c:#fff3ea;--cloud-a:rgba(255,255,255,.95);--cloud-b:rgba(255,236,246,.8)}
html[data-sky="noon"]{--sky-a:#7fbcf7;--sky-b:#bcdcff;--sky-c:#e9f4ff;--cloud-a:rgba(255,255,255,.96);--cloud-b:rgba(232,243,255,.86)}
html[data-sky="dusk"]{--sky-a:#7d78cc;--sky-b:#b79ada;--sky-c:#ffd9dc;--cloud-a:rgba(255,246,250,.9);--cloud-b:rgba(255,214,226,.75)}
html[data-sky="night"]{--sky-a:#0a1526;--sky-b:#132a4c;--sky-c:#1d3a63;--cloud-a:rgba(160,190,235,.16);--cloud-b:rgba(120,150,205,.12)}
body::before{inset:-18%;filter:blur(46px) saturate(120%);opacity:1}
/* 卡片：让边界和层次清楚 */
.panel,.stat,.course-card,.level-card,.track,.hero,.course-route,.side-card{
  box-shadow:var(--sh-card),inset 0 1px 0 var(--glass-edge)!important;
}
.course-card,.hero,.course-route{box-shadow:var(--sh-soft),inset 0 1px 0 var(--glass-edge)!important}
.course-card:hover,.hero:hover{box-shadow:var(--sh-float),inset 0 1px 0 var(--glass-edge)!important}
.sidebar{box-shadow:var(--sh-float),inset 0 1px 0 var(--glass-edge)!important}
/* 顶栏：更轻，避免像一条白杠 */
.topbar{background:rgba(255,255,255,.38)!important;box-shadow:0 1px 2px rgba(24,48,90,.05),0 8px 24px rgba(24,48,90,.08),inset 0 1px 0 rgba(255,255,255,.9)!important}
html[data-sky="night"] .topbar{background:rgba(255,255,255,.1)!important}
/* 旧的主题按钮（现在由外观面板接管）隐藏 */
#themeButton[data-action="cycle-theme"]{display:none!important}
/* 课程卡：更像 iOS 卡片 */
.course-card{padding:26px!important;border-radius:26px!important}
.course-card-icon{width:58px!important;height:58px!important;border-radius:17px!important;font-size:26px!important}
.course-card-body strong{font-size:17px!important;letter-spacing:-.2px}
.course-card-body small{margin-top:4px!important;line-height:1.65}
.course-card-meta{margin-top:8px!important}
/* 页头留白更舒展 */
.page-header{margin:18px 0 26px!important}
.page-header h1{font-size:clamp(30px,3.4vw,42px)!important}
.eyebrow{padding-top:4px}
/* 侧栏：更宽的点击区与更柔和的选中态 */
.nav-btn{padding:12px 14px!important;border-radius:16px!important}
.nav-btn.active{position:relative}
.nav-btn.active::after{content:"";position:absolute;right:12px;width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
/* 外观按钮更低调 */
.ap-fab{right:26px!important;bottom:26px!important;font-size:12px!important}
/* 深色（夜空）下的文字与卡片 */
html[data-sky="night"] .course-card,html[data-sky="night"] .panel,html[data-sky="night"] .stat,html[data-sky="night"] .level-card,html[data-sky="night"] .track,html[data-sky="night"] .course-route,html[data-sky="night"] .hero{background:rgba(255,255,255,.1)!important;border-color:rgba(255,255,255,.24)!important}
html[data-sky="night"] .sidebar{background:rgba(255,255,255,.1)!important;border-color:rgba(255,255,255,.22)!important}
html[data-sky="night"] .nav-btn.active{background:rgba(255,255,255,.18)!important;color:#fff!important}
html[data-sky="night"] .subhead,html[data-sky="night"] .course-card-body small{color:#c7d8f2!important}
html[data-sky="night"] .footer-note{color:#9fb4d4!important;border-top-color:rgba(255,255,255,.16)}

/* ==== 云层加强：柔和分层的云团 ==== */
body::before{
  inset:-12%!important;
  background:
    radial-gradient(36% 24% at 12% 10%,rgba(255,255,255,.98),rgba(255,255,255,0) 62%),
    radial-gradient(26% 17% at 44% 4%,rgba(255,255,255,.85),rgba(255,255,255,0) 60%),
    radial-gradient(32% 21% at 80% 14%,rgba(255,255,255,.95),rgba(255,255,255,0) 62%),
    radial-gradient(40% 25% at 66% 44%,rgba(255,255,255,.7),rgba(255,255,255,0) 64%),
    radial-gradient(26% 17% at 24% 56%,rgba(255,255,255,.62),rgba(255,255,255,0) 62%),
    radial-gradient(34% 22% at 92% 62%,rgba(255,255,255,.7),rgba(255,255,255,0) 62%),
    radial-gradient(52% 30% at 46% 94%,rgba(255,255,255,.85),rgba(255,255,255,0) 66%)!important;
  filter:blur(30px) saturate(112%)!important;
  opacity:.92!important;
}
html[data-sky="night"] body::before{opacity:.5!important;filter:blur(38px)!important}
html[data-sky="dusk"] body::before{opacity:.85!important}
html[data-sky="dawn"] body::before{opacity:.9!important}
/* 底部柔光，让卡片更有景深 */
body .app::after{content:"";position:fixed;left:0;right:0;bottom:0;height:26vh;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.4))}
html[data-sky="night"] body .app::after{background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.22))}

/* ==== 代码块：iOS 深色玻璃 ==== */
.codebox,.ide-frame{
  background:linear-gradient(160deg,rgba(22,33,54,.94),rgba(14,22,38,.96))!important;
  border:1px solid rgba(255,255,255,.14)!important;
  box-shadow:0 14px 40px rgba(16,30,60,.22),inset 0 1px 0 rgba(255,255,255,.12)!important;
  color:#e6efff!important;
}
.codebar,.ide-toolbar{
  background:rgba(255,255,255,.06)!important;
  border-bottom:1px solid rgba(255,255,255,.1)!important;
  color:rgba(226,238,255,.66)!important;
  letter-spacing:1.2px!important;
}
.codebox pre,.codebox code,.ide-highlight,.ide-code{color:#e6efff!important}
.ide-gutter{background:rgba(255,255,255,.04)!important;color:rgba(200,218,245,.4)!important;border-right:1px solid rgba(255,255,255,.07)!important}
.ide-status{background:rgba(255,255,255,.05)!important;color:rgba(226,238,255,.6)!important;border-top:1px solid rgba(255,255,255,.08)!important}
.ide-body{background:transparent!important}
/* 编辑器内文本域（若存在）也走深色玻璃 */
.codebox textarea,.ide-frame textarea{background:rgba(10,18,32,.6)!important;color:#e6efff!important;border-color:rgba(255,255,255,.12)!important}

/* ==== Hero 主卡：深蓝玻璃 + 白色文字（iOS 天气主卡） ==== */
.hero-main,.summary-hero{
  background:linear-gradient(150deg,rgba(38,74,148,.94),rgba(30,54,116,.96) 55%,rgba(46,92,178,.94))!important;
  border:1px solid rgba(255,255,255,.34)!important;
  border-radius:30px!important;
  box-shadow:0 24px 60px rgba(20,48,110,.32),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -20px 60px rgba(10,30,80,.3)!important;
  color:#fff!important;
  position:relative;overflow:hidden;
}
.hero-main::after,.summary-hero::after{content:"";position:absolute;right:-14%;top:-40%;width:56%;height:180%;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.28),transparent 62%)}
.hero-main h1,.summary-hero h1,.hero-main h2,.summary-hero h2{color:#fff!important;text-shadow:0 2px 20px rgba(6,20,50,.3)}
.hero-main p,.summary-hero p{color:rgba(233,242,255,.88)!important}
.hero-main .hero-link,.summary-hero .hero-link{color:rgba(233,242,255,.75)!important}
.hero-main .btn-primary,.summary-hero .btn-primary{background:rgba(255,255,255,.95)!important;color:#1f3d7a!important;border-color:rgba(255,255,255,.9)!important;box-shadow:0 8px 22px rgba(8,24,60,.24),inset 0 1px 0 #fff!important}
.hero-main .btn-ghost,.summary-hero .btn-ghost{background:rgba(255,255,255,.16)!important;border-color:rgba(255,255,255,.34)!important;color:#fff!important}
.hero-main .chip,.summary-hero .chip{background:rgba(255,255,255,.18)!important;border-color:rgba(255,255,255,.3)!important;color:#eaf2ff!important}

/* ==== 统一鼠标交互（hover / active / focus-visible） ==== */
/* 所有卡片统一过渡，避免有的动有的不动 */
.course-card,.level-card,.stat,.course-entry,.side-card,.audio-row,.quiz-item,.skill-row,
.guide-card,.guide-idea,.self-check,.recorder-row,.takeaway-item,.passage,
.panel,.track,.course-route,.hero,.hero-main,.summary-hero,.option,.streak,.avatar{
  transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s ease,border-color .22s ease,background-color .22s ease;
  will-change:auto;
}
/* ---------- 叶子卡片：轻抬 + 阴影增强 + 描边提亮 ---------- */
.stat:hover,.course-entry:hover,.side-card:hover,.audio-row:hover,.quiz-item:hover,
.skill-row:hover,.guide-card:hover,.guide-idea:hover,.self-check:hover,
.recorder-row:hover,.takeaway-item:hover{
  transform:translateY(-3px);
  border-color:rgba(255,255,255,.95)!important;
  box-shadow:0 6px 14px rgba(20,44,86,.09),0 24px 52px rgba(20,44,86,.18),inset 0 1px 0 rgba(255,255,255,.98)!important;
}
.stat:active,.course-entry:active,.audio-row:active,.quiz-item:active,.skill-row:active,
.guide-card:active,.guide-idea:active,.self-check:active,.recorder-row:active,.takeaway-item:active{
  transform:translateY(-1px) scale(.997);
  box-shadow:0 3px 8px rgba(20,44,86,.08),0 12px 26px rgba(20,44,86,.14),inset 0 1px 0 rgba(255,255,255,.9)!important;
}
/* ---------- 大容器：不位移，只提亮描边 + 加深投影 ---------- */
.panel:hover,.track:hover,.course-route:hover,.passage:hover{
  border-color:rgba(255,255,255,.95)!important;
  box-shadow:0 2px 6px rgba(20,44,86,.06),0 18px 44px rgba(20,44,86,.14),inset 0 1px 0 rgba(255,255,255,.97)!important;
}
/* ---------- Hero 主卡 ---------- */
.hero:hover,.hero-main:hover,.summary-hero:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 16px rgba(20,44,86,.10),0 30px 70px rgba(20,44,86,.20),inset 0 1px 0 rgba(255,255,255,.5)!important;
}
.hero-main:hover,.summary-hero:hover{
  box-shadow:0 30px 74px rgba(18,44,104,.38),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -20px 60px rgba(10,30,80,.32)!important;
}
/* ---------- 课程卡 / 关卡卡 / 选项：统一到同一套手感 ---------- */
.course-card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(20,44,86,.10),0 30px 66px rgba(20,44,86,.20),inset 0 1px 0 rgba(255,255,255,.98)!important}
.level-card:hover{transform:translateY(-2px);box-shadow:0 5px 12px rgba(20,44,86,.08),0 18px 40px rgba(20,44,86,.15),inset 0 1px 0 rgba(255,255,255,.95)!important}
.course-card:active,.level-card:active{transform:translateY(-1px) scale(.998)}
.option:hover{transform:translateY(-1px)}
/* ---------- 键盘可达性 ---------- */
.course-card:focus-visible,.level-card:focus-visible,.option:focus-visible,.nav-btn:focus-visible,
.btn:focus-visible,.course-entry:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--accent);outline-offset:3px;
}
/* ---------- 夜空预设下的手感 ---------- */
html[data-sky="night"] .stat:hover,html[data-sky="night"] .course-entry:hover,
html[data-sky="night"] .side-card:hover,html[data-sky="night"] .audio-row:hover,
html[data-sky="night"] .quiz-item:hover,html[data-sky="night"] .skill-row:hover,
html[data-sky="night"] .guide-card:hover,html[data-sky="night"] .guide-idea:hover,
html[data-sky="night"] .self-check:hover,html[data-sky="night"] .recorder-row:hover,
html[data-sky="night"] .takeaway-item:hover{
  border-color:rgba(255,255,255,.42)!important;
  box-shadow:0 8px 22px rgba(0,0,0,.42),0 26px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.22)!important;
}
html[data-sky="night"] .panel:hover,html[data-sky="night"] .track:hover,html[data-sky="night"] .course-route:hover{
  border-color:rgba(255,255,255,.34)!important;
  box-shadow:0 20px 50px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,255,255,.16)!important;
}
html[data-sky="night"] .hero-main:hover,html[data-sky="night"] .summary-hero:hover{
  box-shadow:0 32px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.3)!important;
}
/* 触屏设备不启用位移 */
@media(hover:none){.stat:hover,.course-entry:hover,.side-card:hover,.audio-row:hover,.quiz-item:hover,
.skill-row:hover,.guide-card:hover,.guide-idea:hover,.self-check:hover,.recorder-row:hover,
.takeaway-item:hover,.course-card:hover,.level-card:hover,.hero:hover,.hero-main:hover,.summary-hero:hover{transform:none}}

/* ==== 全站 UI 落实 ==== */
/* ---------- 侧栏导航：玻璃胶囊 + 位移手感 ---------- */
.nav{display:grid;gap:5px}
.nav-btn{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:12px 14px;border:1px solid transparent;border-radius:15px;
  background:transparent;color:var(--ink-2);font:inherit;font-size:13.5px;font-weight:600;
  cursor:pointer;position:relative;transition:transform .2s,background .2s,color .2s,box-shadow .2s,border-color .2s;
}
.nav-btn:hover{
  background:rgba(255,255,255,.5);color:var(--ink);transform:translateX(2px);
  border-color:rgba(255,255,255,.8);box-shadow:0 4px 14px rgba(20,44,86,.07),inset 0 1px 0 rgba(255,255,255,.9);
}
.nav-btn:active{transform:translateX(1px) scale(.99)}
.nav-btn.active{
  background:rgba(255,255,255,.76);color:var(--ink);
  border-color:rgba(255,255,255,.95);
  box-shadow:0 2px 6px rgba(20,44,86,.06),0 10px 24px rgba(20,44,86,.1),inset 0 1px 0 #fff;
  font-weight:680;
}
.nav-btn.active::before{
  content:"";position:absolute;left:5px;top:50%;transform:translateY(-50%);
  width:3px;height:17px;border-radius:99px;background:linear-gradient(180deg,var(--accent),var(--accent-2));
}
.nav-btn.active .nav-icon{color:var(--accent)}
.nav-icon{width:18px;height:18px;display:grid;place-items:center;opacity:.9;transition:color .2s,opacity .2s}
.nav-btn:hover .nav-icon{opacity:1}
.nav-label{font-size:9.5px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--ink-3);padding:14px 6px 8px}
html[data-sky="night"] .nav-btn{color:#b9cbe6}
html[data-sky="night"] .nav-btn:hover{background:rgba(255,255,255,.12);color:#fff}
html[data-sky="night"] .nav-btn.active{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.3)}
html[data-sky="night"] .nav-btn.active .nav-icon{color:#9fe3ff}

/* ---------- 关卡卡片：完整重做 ---------- */
.level-grid{display:grid;gap:12px;margin-top:14px}
.level-card{
  position:relative;display:block;padding:16px;border-radius:18px;overflow:hidden;
  background:rgba(255,255,255,.56);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 1px 2px rgba(20,44,86,.05),0 6px 18px rgba(20,44,86,.07),inset 0 1px 0 rgba(255,255,255,.95);
  transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s,border-color .22s,background .22s;
  cursor:pointer;
}
.level-card::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,255,255,.42),rgba(255,255,255,0) 38%);
  mix-blend-mode:screen;opacity:.7;
}
.level-card>*{position:relative;z-index:1}
.level-card:hover{
  transform:translateY(-3px);
  background:rgba(255,255,255,.72);
  border-color:rgba(255,255,255,1);
  box-shadow:0 3px 8px rgba(20,44,86,.07),0 22px 48px rgba(20,44,86,.16),inset 0 1px 0 #fff;
}
.level-card:active{transform:translateY(-1px) scale(.995)}
.level-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.level-num{
  display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;
  background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);
  font-size:10px;font-weight:750;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95);
}
.level-card h3{font-size:13.5px;font-weight:700;letter-spacing:-.1px;color:var(--ink);margin:0 0 6px;line-height:1.4}
.level-card p{font-size:11.5px;color:var(--ink-2);line-height:1.65;margin:0 0 10px}
.level-meta{font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.level-state{font-size:11.5px;font-weight:700;color:var(--accent-2)}
/* 状态 */
.level-card.completed{
  background:linear-gradient(158deg,rgba(255,255,255,.72),rgba(226,252,242,.62));
  border-color:rgba(120,215,180,.6);
}
.level-card.completed .level-state{color:#0aa578}
.level-card.completed .level-num{background:rgba(226,252,242,.9);border-color:rgba(120,215,180,.5);color:#0a8f66}
.level-card.current{
  border-color:rgba(47,124,246,.55);
  box-shadow:0 0 0 2px var(--accent-soft),0 8px 22px rgba(20,44,86,.1),inset 0 1px 0 #fff;
}
.level-card.locked{opacity:.74;background:rgba(255,255,255,.36);cursor:not-allowed;
  box-shadow:0 1px 2px rgba(20,44,86,.04),0 5px 14px rgba(20,44,86,.06),inset 0 1px 0 rgba(255,255,255,.85)}
/* 锁定关同样有 hover 反馈（只是不能点击进入） */
.level-card.locked:hover{
  opacity:.92;background:rgba(255,255,255,.56);border-color:rgba(255,255,255,.98);
  transform:translateY(-3px);
  box-shadow:0 3px 8px rgba(20,44,86,.07),0 20px 44px rgba(20,44,86,.14),inset 0 1px 0 #fff;
}
.level-card.locked:active{transform:translateY(-1px) scale(.995)}
.level-card.locked:hover .level-state{transform:scale(1.12);filter:saturate(1.2)}
.level-card.locked .level-state{transition:transform .2s,filter .2s}
.level-card.is-soon{opacity:.78}
/* 夜空 */
html[data-sky="night"] .level-card{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.2);box-shadow:0 10px 26px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.14)}
html[data-sky="night"] .level-card:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4);box-shadow:0 20px 46px rgba(0,0,0,.46),inset 0 1px 0 rgba(255,255,255,.2)}
html[data-sky="night"] .level-num{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:#d6e6ff}
html[data-sky="night"] .level-card p{color:#b9cbe6}
html[data-sky="night"] .level-card.completed{background:rgba(70,220,170,.14);border-color:rgba(120,235,195,.4)}
html[data-sky="night"] .level-card.locked{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);box-shadow:0 8px 22px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.1)}
html[data-sky="night"] .level-card.locked:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.34);box-shadow:0 18px 42px rgba(0,0,0,.44),inset 0 1px 0 rgba(255,255,255,.18)}

/* ---------- 路线 / 关卡容器 ---------- */
.track{padding:18px!important;border-radius:20px!important;margin-top:14px}
.track-head{
  display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:14px;
  background:rgba(255,255,255,.46);border:1px solid rgba(255,255,255,.72);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);margin-bottom:4px;
  transition:background .2s,border-color .2s,box-shadow .2s;
}
.track:hover .track-head{background:rgba(255,255,255,.6);border-color:rgba(255,255,255,.9)}
.track-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);flex:none}
.track-title{font-size:13.5px!important;font-weight:700;color:var(--ink)!important;letter-spacing:-.1px}
.track-note{margin-left:auto;font-size:9.5px!important;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-3)!important;font-weight:650}
.course-route{padding:22px!important;border-radius:26px!important}
.course-route-heading{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.44);border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.course-route-heading h2{font-size:17px!important;font-weight:750;color:var(--ink)!important}
.course-route-heading p{font-size:11px!important;color:var(--ink-3)!important}
.course-route-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#647df8,#435bdc);color:#fff;font-weight:800;box-shadow:0 8px 18px rgba(52,96,180,.26)}
.course-library{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important}
.course-library-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.course-library-total{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:var(--ink-3);background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.75);border-radius:99px;padding:4px 10px}
.course-entry{
  display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;
  background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.78);
  box-shadow:0 1px 2px rgba(20,44,86,.04),0 6px 16px rgba(20,44,86,.06),inset 0 1px 0 rgba(255,255,255,.92);
  transition:transform .2s,box-shadow .2s,border-color .2s,background .2s;cursor:pointer;margin-bottom:10px;
}
.course-entry:hover{transform:translateY(-2px);background:rgba(255,255,255,.68);box-shadow:0 12px 30px rgba(20,44,86,.13),inset 0 1px 0 #fff}
.course-entry-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#647df8,#435bdc);color:#fff;font-weight:800;font-size:17px;box-shadow:0 8px 18px rgba(52,96,180,.24)}
.course-entry-copy strong{font-size:14px;font-weight:700;color:var(--ink)}
.course-entry-copy small{font-size:11px;color:var(--ink-2)}
.course-entry-bar{height:3px;border-radius:99px;background:rgba(20,44,86,.1);overflow:hidden;margin-top:7px}
.course-entry-bar i{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.course-entry-arrow{color:var(--accent);font-weight:650}
.course-tag{font-size:9px;letter-spacing:1px;text-transform:uppercase;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:3px 8px}

/* ---------- 统计卡 ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.stat{padding:16px 18px!important;border-radius:18px!important}
.stat-icon{width:30px;height:30px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:14px;margin-bottom:8px}
.stat-num{font-size:26px!important;font-weight:750!important;letter-spacing:-1.1px;color:var(--ink)!important;font-variant-numeric:tabular-nums;line-height:1.1}
.stat-label{margin-top:3px;font-size:9px!important;letter-spacing:1.5px!important;text-transform:uppercase;color:var(--ink-3)!important;font-weight:700}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}

/* ---------- 讲解 / 挑战 / 要点 ---------- */
.lesson-layout{gap:18px}
.lesson-main{min-width:0}
.lesson-title-row h2{font-size:17px!important;font-weight:750!important;letter-spacing:-.3px;color:var(--ink)!important}
.lesson-badge{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(47,124,246,.18);border-radius:99px;padding:4px 10px}
.challenge-card{background:rgba(255,255,255,.42)!important;border:1px solid rgba(255,255,255,.7)!important;border-radius:16px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)!important;padding:16px!important}
.challenge-head{margin-bottom:8px}
.challenge-label{font-size:10.5px!important;letter-spacing:1.3px;text-transform:uppercase;font-weight:750;color:var(--ink)!important}
.challenge-copy{font-size:12.5px!important;color:var(--ink-2)!important;line-height:1.8}
.point-list{display:grid;gap:8px;margin:12px 0}
.point-item{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:13px;background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.65);transition:background .2s,transform .2s,box-shadow .2s}
.point-item:hover{background:rgba(255,255,255,.62);transform:translateX(2px);box-shadow:0 6px 16px rgba(20,44,86,.08)}
.point-no{width:20px;height:20px;border-radius:7px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:800;flex:none}
.point-ok{color:var(--accent-2);font-weight:800}
.takeaway{border-radius:16px;background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.7);padding:14px}
.takeaway-item{font-size:12.5px;color:var(--ink-2);padding:6px 0}
.tick{color:var(--accent-2);font-weight:800;margin-right:6px}
.lock-note{background:rgba(255,255,255,.5)!important;border:1px dashed rgba(20,44,86,.14)!important;border-radius:13px!important;color:var(--ink-3)!important;font-size:11.5px!important}
.wordcount{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.exercise{border-radius:18px;padding:16px}
.exercise-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* ---------- 答题 / 选项 ---------- */
.option-list{display:grid;gap:9px;margin-top:12px}
.option{
  display:flex;align-items:center;gap:10px;padding:12px 15px;border-radius:14px;
  background:rgba(255,255,255,.46);border:1px solid rgba(255,255,255,.75);
  color:var(--ink);font-size:13px;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
  transition:transform .18s,background .18s,box-shadow .18s,border-color .18s;
}
.option:hover{transform:translateY(-1px);background:rgba(255,255,255,.66);box-shadow:0 8px 20px rgba(20,44,86,.1)}
.option:active{transform:none}
.option.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent),inset 0 1px 0 rgba(255,255,255,.8)}
.option.correct{border-color:rgba(0,179,164,.6);background:rgba(0,179,164,.14)}
