<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>火柴人训练营 · 疾风忍刀</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="rotate-hint">
    <div class="rotate-card">
      <div class="phone-icon">📱</div>
      <p>请将手机横屏后游玩</p>
      <p class="sub">Rotate your phone to landscape</p>
    </div>
  </div>

  <div id="hud">
    <div class="hp-wrap left">
      <div class="name red">红方 · 你</div>
      <div class="bar"><div id="hp-player" class="fill red"></div></div>
    </div>
    <div class="center-info">
      <div id="weapon-name">武器：疾风忍刀</div>
      <div id="round-tip">训练营 · 击败蓝方机器人</div>
    </div>
    <div class="hp-wrap right">
      <div class="name blue">蓝方 · 机器人</div>
      <div class="bar"><div id="hp-enemy" class="fill blue"></div></div>
    </div>
  </div>

  <canvas id="game"></canvas>

  <div id="controls">
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-knob"></div>
      </div>
    </div>
    <div id="skill-pad">
      <button class="skill-btn" data-skill="attack" id="btn-attack">
        <span class="label">普攻</span>
        <span class="key">4A</span>
        <span class="cd" id="cd-attack"></span>
      </button>
      <button class="skill-btn" data-skill="s1" id="btn-s1">
        <span class="label">瞬步·居合</span>
        <span class="key">1</span>
        <span class="cd" id="cd-s1"></span>
      </button>
      <button class="skill-btn" data-skill="s2" id="btn-s2">
        <span class="label">旋风升龙</span>
        <span class="key">2</span>
        <span class="cd" id="cd-s2"></span>
      </button>
      <button class="skill-btn" data-skill="s3" id="btn-s3">
        <span class="label">影袭·燕返</span>
        <span class="key">3</span>
        <span class="cd" id="cd-s3"></span>
      </button>
    </div>
  </div>

  <button id="btn-hud-keys" type="button" class="hud-keys" title="键位设置">⚙</button>

  <div id="start-screen">
    <div class="start-card">
      <div class="start-eyebrow">STICKMAN TRAINING · 疾风忍刀</div>
      <h1>火柴人训练营</h1>
      <p class="start-sub">纯 Canvas 2D 横刀格斗 · 击败蓝方机器人</p>
      <div class="start-keys">
        <span>移动 <b>WASD / ←↑↓→</b></span>
        <span>普攻 <b>J / 空格</b></span>
        <span>技能 <b>K L U</b> 或 <b>1 2 3</b></span>
      </div>
      <div class="start-actions">
        <button id="btn-start" type="button" class="start-btn primary">开始游戏</button>
        <button id="btn-keys" type="button" class="start-btn">键位设置</button>
      </div>
      <p class="start-hint">手机横屏：左侧摇杆移动，右侧技能键（键位可在设置里修改）</p>
    </div>
  </div>

  <div id="layout-bar" class="hidden" role="status">
    <span>拖动左侧摇杆 / 右侧技能区调整位置</span>
    <button id="btn-layout-reset" type="button" class="start-btn">复位</button>
    <button id="btn-layout-save" type="button" class="start-btn primary">保存</button>
  </div>

  <div id="keys-panel" class="hidden" role="dialog" aria-modal="true" aria-label="键位设置">
    <div class="keys-card">
      <div class="keys-head"><h2>键位设置</h2><button id="btn-keys-close" type="button" class="keys-close" aria-label="关闭">✕</button></div>
      <div class="keys-list" id="keysList"></div>
      <div class="keys-actions">
        <button id="btn-layout-edit" type="button" class="start-btn">调整按钮位置</button>
        <button id="btn-keys-reset" type="button" class="start-btn">恢复默认</button>
        <button id="btn-keys-done" type="button" class="start-btn primary">完成</button>
      </div>
      <p class="keys-tip">点「修改」后按下新键；Esc 取消。手机上使用右侧技能键与左侧摇杆。</p>
    </div>
  </div>

  <div id="overlay" class="hidden">
    <div class="panel">
      <h2 id="result-title">胜利</h2>
      <p id="result-desc">训练完成</p>
      <button id="btn-restart">再来一局</button>
    </div>
  </div>

  <script src="js/input.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
